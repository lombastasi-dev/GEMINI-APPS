<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signal — Dating Communication Toolkit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,sans-serif;color:#263238}
body{background:linear-gradient(135deg,#FFE4E1,#E0F7FA);min-height:100vh}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.sidebar{position:fixed;z-index:50;left:0;top:0;bottom:0;width:240px;background:#fff;box-shadow:3px 0 18px rgba(38,50,56,.1);padding:22px 14px;overflow:auto}
.brand{font-size:25px;font-weight:800;text-align:center;margin:3px 0 4px;background:linear-gradient(90deg,#FF6B9D,#4ECDC4);-webkit-background-clip:text;color:transparent}
.tag-mini{text-align:center;font-size:11px;color:#78909c;margin-bottom:20px}
.nav{display:flex;flex-direction:column;gap:5px}.nav button{border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:10px;color:#546e7a;transition:.2s;display:flex;gap:10px;align-items:center;font-weight:600;font-size:13px}
.nav button:hover{background:#f8f9fa;color:#263238}.nav button.active{background:#fff0f5;color:#e94d83}.nav i{width:20px;text-align:center}
.mobilebar{display:none}.overlay{display:none}
main{margin-left:240px;min-height:100vh;padding:38px 28px 80px}
.content{max-width:800px;margin:0 auto}
.screen{display:none}.screen.active{display:block}
.hero{text-align:center;padding:55px 10px 25px}.hero-logo{font-size:72px;font-weight:800;letter-spacing:-4px;background:linear-gradient(90deg,#FF6B9D,#4ECDC4);-webkit-background-clip:text;color:transparent}
.hero h1{font-size:18px;margin:5px 0;color:#455a64}.hero p{color:#78909c}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card,.panel{background:#fff;border-radius:12px;box-shadow:0 7px 25px rgba(38,50,56,.08);padding:24px}
.card{cursor:pointer;transition:.2s}.card:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(38,50,56,.13)}
.card i{font-size:22px;color:#ff6b9d;margin-bottom:13px}.card h3{font-size:15px;margin:0 0 7px}.card p{font-size:12px;color:#78909c;line-height:1.5;margin:0}
.tool-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:18px}.tool-head h2{margin:0;font-size:25px}.tool-head p{margin:5px 0 0;color:#78909c;font-size:13px}
label{display:block;font-size:12px;font-weight:700;margin:15px 0 7px;color:#455a64}
textarea,input[type=text],input[type=number],select{width:100%;border:1px solid #dbe5e8;border-radius:9px;padding:12px;background:#fbfdfe;outline:0}
textarea{min-height:110px;resize:vertical}textarea:focus,input:focus,select:focus{border-color:#4ecdc4;box-shadow:0 0 0 3px rgba(78,205,196,.12)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.choices{display:flex;flex-wrap:wrap;gap:8px}.choice{position:relative}.choice input{position:absolute;opacity:0}.choice span{display:block;border:1px solid #dbe5e8;border-radius:999px;padding:8px 11px;font-size:12px;color:#607d8b;background:#fff}.choice input:checked+span{background:#e9fbf9;border-color:#4ecdc4;color:#168f88;font-weight:700}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.btn{border:0;border-radius:9px;padding:10px 15px;font-weight:700;font-size:12px;transition:.2s}.primary{background:#ff6b9d;color:#fff}.secondary{background:#eaf9f8;color:#168f88}.ghost{background:#f4f6f7;color:#546e7a}.danger{background:#fff0f1;color:#d94d5f}.btn:hover{filter:brightness(.97);transform:translateY(-1px)}
.output{margin-top:20px}.result-section{border-top:1px solid #edf1f2;padding:17px 0}.result-section:first-child{border-top:0}.result-section h4{font-size:11px;letter-spacing:.06em;margin:0 0 9px;color:#607d8b}.result-section p,.result-section li{font-size:13px;line-height:1.6}.result-section ul{margin:7px 0;padding-left:20px}
.badge{font-size:10px;border-radius:999px;padding:3px 7px;margin-left:6px;font-weight:700}.low{background:#eceff1;color:#607d8b}.medium{background:#fff3c4;color:#8a6d00}.high{background:#dff5e8;color:#24764a}
.verdict{border-radius:12px;padding:20px;text-align:center;font-weight:800;font-size:22px}.v-green{background:#ddf6e8;color:#24764a}.v-yellow{background:#fff4c7;color:#8a6d00}.v-red{background:#ffe4e7;color:#c53e4f}.v-orange{background:#ffead8;color:#b65a18}
.message{position:relative;background:#f8fafb;border:1px solid #e8eef0;border-radius:10px;padding:13px 45px 13px 14px;margin:9px 0;font-size:13px;line-height:1.55}.copy{position:absolute;right:8px;top:8px;border:0;background:#fff;border-radius:7px;padding:7px;color:#607d8b}
.tabs{display:flex;gap:5px;margin-bottom:15px}.tab{flex:1;border:0;background:#eef3f4;padding:10px;border-radius:8px;font-weight:700;color:#607d8b}.tab.active{background:#ffedf3;color:#df4e83}
.hidden{display:none!important}.history{margin-top:20px}.history summary{cursor:pointer;font-weight:700;font-size:13px}.history-item{padding:10px 0;border-bottom:1px solid #edf1f2;font-size:12px;cursor:pointer}.history-item small{display:block;color:#90a4ae;margin-top:4px}
.toast{position:fixed;z-index:100;bottom:25px;left:50%;transform:translateX(-50%);background:#263238;color:white;padding:10px 16px;border-radius:8px;font-size:12px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}
footer{position:fixed;bottom:0;left:240px;right:0;text-align:center;padding:9px;background:rgba(255,255,255,.88);font-size:10px;color:#78909c;z-index:20}
.checkline{display:flex;gap:8px;align-items:center;margin:7px 0;font-size:12px;color:#607d8b}.checkline input{accent-color:#ff6b9d}
.info{background:#f5fbfb;border-left:3px solid #4ecdc4;padding:12px;border-radius:7px;font-size:12px;line-height:1.5}
.warn{background:#fff5f5;border:1px solid #f1aeb5;border-left:4px solid #e85b68;padding:13px;border-radius:8px;font-size:12px;line-height:1.5}
.signal-list{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.signal-box{padding:12px;border-radius:9px;background:#f8fafb}.signal-box h5{margin:0 0 6px;font-size:11px}.signal-box p{margin:0;font-size:11px;line-height:1.5}
footer,main{transition:.2s}
@media(max-width:850px){.sidebar{transform:translateX(-105%);transition:.2s}.sidebar.open{transform:translateX(0)}.mobilebar{display:flex;position:fixed;z-index:60;top:0;left:0;right:0;height:52px;background:#fff;align-items:center;padding:0 14px;box-shadow:0 2px 12px rgba(0,0,0,.08)}.hamb{border:0;background:transparent;font-size:20px;color:#546e7a}.mobile-title{font-weight:800;margin-left:10px}.overlay.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:40}main{margin-left:0;padding-top:70px}.grid{grid-template-columns:1fr 1fr}footer{left:0}.hero{padding-top:30px}}
@media(max-width:560px){.grid,.row,.signal-list{grid-template-columns:1fr}.panel,.card{padding:18px}.tool-head{align-items:flex-start}.tool-head h2{font-size:21px}.hero-logo{font-size:56px}.choices{flex-direction:column}.choice span{border-radius:8px}}
</style>
</head>
<body>
<div class="mobilebar"><button class="hamb" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></button><span class="mobile-title">Signal</span></div>
<div class="overlay" id="overlay" onclick="toggleMenu()"></div>
<aside class="sidebar" id="sidebar">
  <div class="brand">Signal</div><div class="tag-mini">Dating Communication Toolkit</div>
  <nav class="nav" id="nav"></nav>
</aside>
<main><div class="content" id="app"></div></main>
<footer>For entertainment purposes only. Not professional advice.</footer>
<div class="toast" id="toast">Copied!</div>

<script>
const tools=[
['dashboard','Dashboard','fa-house','Your toolkit at a glance.'],
['decoder','Text Decoder','fa-message','Decode a confusing text without mind-reading.'],
['textnow','Should I Text Them?','fa-paper-plane','Decide whether to reach out now, later, or not at all.'],
['say','What Should I Say?','fa-pen','Turn difficult feelings into clear messages.'],
['stopped','Why Did They Stop Replying?','fa-clock','Separate observable changes from assumptions.'],
['date','First Date Coach','fa-heart','Before, during, and after-date guidance.'],
['signals','Date Signal Checker','fa-signal','Look for patterns that actually mean something.'],
['messup','Did I Mess This Up?','fa-circle-question','Check whether a message needs repair.'],
['crush','What Do I Say to My Crush?','fa-face-smile','Natural messages for common crush situations.'],
['ignored','Am I Being Ignored?','fa-eye-slash','Assess the pattern without jumping to certainty.']
];
const icon=x=>`<i class="fa-solid ${x}"></i>`;
const nav=document.getElementById('nav');
nav.innerHTML=tools.map(t=>`<button data-tool="${t[0]}" onclick="show('${t[0]}')">${icon(t[2])}<span>${t[1]}</span></button>`).join('');
const app=document.getElementById('app');
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function toast(msg='Copied!'){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}
async function copyText(text){try{await navigator.clipboard.writeText(text)}catch(e){const a=document.createElement('textarea');a.value=text;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}toast()}
function toggleMenu(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('overlay').classList.toggle('show')}
function show(id){
 document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));
 const el=document.getElementById('screen-'+id);if(el){el.classList.add('active')}else{render(id)}
 document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tool===id));
 document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show');scrollTo(0,0)
}
function shell(id,title,desc,body){return `<section class="screen active" id="screen-${id}"><div class="tool-head"><div><h2>${title}</h2><p>${desc}</p></div></div>${body}</section>`}
function panel(x){return `<div class="panel">${x}</div>`}
function actions(sample,analyze,clear='Clear'){return `<div class="actions"><button class="btn primary" onclick="${analyze}">Analyze</button><button class="btn secondary" onclick="${sample}">Load Sample Scenario</button></div>`}
function saveHistory(tool,input,output){
 const k='signal_history_'+tool;let a=JSON.parse(localStorage.getItem(k)||'[]');a.unshift({id:Date.now(),input,output,timestamp:new Date().toISOString()});a=a.slice(0,50);localStorage.setItem(k,JSON.stringify(a));renderHistory(tool)
}
function getHistory(tool){return JSON.parse(localStorage.getItem('signal_history_'+tool)||'[]')}
function renderHistory(tool){
 const box=document.querySelector('#hist-'+tool);if(!box)return;
 const a=getHistory(tool).slice(0,10);
 box.innerHTML=a.length?a.map((x,i)=>`<div class="history-item" onclick="loadHistory('${tool}',${i})">${esc(new Date(x.timestamp).toLocaleString())}<small>${esc(preview(x.input))}</small></div>`).join(''):'<div style="font-size:12px;color:#90a4ae">No saved history yet.</div>'
}
function preview(o){let s=typeof o==='string'?o:Object.values(o||{}).join(' · ');return s.replace(/\s+/g,' ').slice(0,100)}
function historyBlock(tool){return `<details class="history panel"><summary>History — last 10</summary><div id="hist-${tool}" style="margin-top:12px"></div><button class="btn danger" style="margin-top:12px" onclick="clearHistory('${tool}')">Clear History</button></details>`}
function clearHistory(tool){localStorage.removeItem('signal_history_'+tool);renderHistory(tool);toast('History cleared')}
function loadHistory(tool,i){const x=getHistory(tool)[i];if(!x)return;alert('Saved '+new Date(x.timestamp).toLocaleString()+'\\n\\n'+preview(x.input));}

function render(id){
 if(id==='dashboard')return renderDashboard();
 const bodies={
 decoder:()=>decoderHTML(),textnow:()=>textNowHTML(),say:()=>sayHTML(),stopped:()=>stoppedHTML(),date:()=>dateHTML(),signals:()=>signalsHTML(),messup:()=>messupHTML(),crush:()=>crushHTML(),ignored:()=>ignoredHTML()
 };
 app.innerHTML=bodies[id]();show(id);renderHistory(id);
}
function renderDashboard(){app.innerHTML=`<section class="screen active" id="screen-dashboard"><div class="hero"><div class="hero-logo">Signal</div><h1>Decode texts. Stop overthinking. Know what to do.</h1><p>Nine practical communication tools built around observable patterns, uncertainty, and healthier next steps.</p></div><div class="grid">${tools.slice(1).map(t=>`<div class="card" onclick="show('${t[0]}')">${icon(t[2])}<h3>${t[1]}</h3><p>${t[3]}</p></div>`).join('')}</div></section>`}
function decoderHTML(){return shell('decoder','Text Decoder','Read the message without pretending you can read their mind.',panel(`<label>Confusing message</label><textarea id="decInput" placeholder="Paste the confusing message here..."></textarea>${actions('sampleDecoder()','analyzeDecoder()')}<div id="decOut" class="output"></div>`) + historyBlock('decoder'))}
function sampleDecoder(){document.getElementById('decInput').value='k.'}
function analyzeDecoder(){
 const s=document.getElementById('decInput').value.trim();if(!s)return alert('Paste a message first.');
 let out;
 if(s.toLowerCase()==='k.'||s.toLowerCase()==='k'){
  out={literal:"The letter 'k' — an abbreviated acknowledgment.",tone:"Short, neutral to potentially cold.",ints:[['Neutral acknowledgment','Low'],['Mild irritation','Medium'],['Conversation shutdown','Medium'],['Busy/distracted','High'],['Typical texting style for this person','High']],cannot:"We cannot know their emotional state, what they were doing, or whether this tone is unusual for them.",not:"Don't assume anger, rejection, or that they are punishing you.",msgs:["Sounds good!","Okay! Let me know when you're free to chat more.","No response needed right now."]};
 }else{
  let ints=[], tone='Neutral / unclear.';
  const l=s.toLowerCase();
  if(/love|miss|thinking of you/.test(l)){tone='Warm / affectionate language is observable.';ints=[['They are expressing warmth','High'],['They want connection','Medium'],['They may simply be using affectionate wording','Low']]}
  else if(/\bk\b|\bok\b|\bsure\b|\bfine\b/.test(l)){tone='Short; potentially neutral, restrained, or cold depending on context.';ints=[['Simple acknowledgment','Medium'],['Busy or distracted','Medium'],['Conversation winding down','Medium']]}
  else if((s.match(/\?/g)||[]).length>=2){tone='Engaged / questioning tone.';ints=[['They are actively engaging','High'],['They want clarification','Medium'],['They are keeping the conversation moving','Medium']]}
  else if(s.length>250){tone='Longer / potentially warm and engaged.';ints=[['They invested effort in the reply','Medium'],['They are engaged with the topic','Medium'],['Their style is naturally detailed','Low']]}
  else ints=[['Neutral meaning consistent with the words','Medium'],['Context may change the tone','Low'],['Their usual texting style may explain it','Low']];
  out={literal:'The words communicate their direct content; context determines what lies beyond that.',tone,ints,cannot:'We cannot know their private emotional state, intentions, or whether this tone is unusual for them without more context.',not:'Do not treat one message as proof of rejection, anger, attraction, punishment, or a change in the relationship.',msgs:['Sounds good!','Thanks for letting me know — I appreciate it.','I’ll leave it here for now.'],};
 }
 document.getElementById('decOut').innerHTML=`${sec('LITERAL MEANING',`<p>${esc(out.literal)}</p>`)}${sec('TONE',`<p>${esc(out.tone)}</p>`)}${sec('POSSIBLE INTERPRETATIONS','<ul>'+out.ints.map(x=>`<li>${esc(x[0])}<span class="badge ${x[1].toLowerCase()}">${x[1]}</span></li>`).join('')+'</ul>')}${sec('WHAT WE CANNOT KNOW',`<p>${esc(out.cannot)}</p>`)}${sec('WHAT NOT TO ASSUME',`<div class="warn">${esc(out.not)}</div>`)}${sec('SUGGESTED RESPONSES',messages(out.msgs,['Casual','Warm','Give Them Space']))}${sec('IMPULSE CHECK',`<p>Are you feeling anxious right now?</p><div class="actions"><button class="btn secondary" onclick="impulse(true)">Yes</button><button class="btn ghost" onclick="impulse(false)">No</button></div><div id="impulse"></div>`)} `;
 saveHistory('decoder',{message:s},out)
}
function impulse(y){document.getElementById('impulse').innerHTML=y?'<div class="info" style="margin-top:10px">Take a breath. You don\'t need to respond immediately. Step away for 10 minutes.</div>':'<div class="info" style="margin-top:10px">Good. Give yourself a moment before deciding what the message means.</div>'}
function sec(h,c){return `<div class="result-section"><h4>${h}</h4>${c}</div>`}
function messages(arr,labels){return arr.map((m,i)=>`<div class="message"><b>${labels[i]}</b><br>${esc(m)}<button class="copy" onclick="copyText(${JSON.stringify(m)})" title="Copy"><i class="fa-regular fa-copy"></i></button></div>`).join('')}

function textNowHTML(){return shell('textnow','Should I Text Them?','Use timing and patterns—not panic—to choose your next move.',panel(`<div class="row"><div><label>What happened?</label><textarea id="tnWhat"></textarea></div><div><label>Last message sent:</label><textarea id="tnLast"></textarea></div></div><label>Who sent the last message?</label>${radio('tnWho',['Me','Them'])}<label>Time since contact:</label><select id="tnTime">${['Less than 1 hour','1-6 hours','6-24 hours','1-3 days','3-7 days','1+ weeks'].map(x=>`<option>${x}</option>`).join('')}</select><label>Relationship stage:</label><select id="tnStage">${['Just met','Talking','Dating','Exclusive','Complicated','Ex'].map(x=>`<option>${x}</option>`).join('')}</select><label>Recent pattern:</label>${radio('tnPattern',['They usually reply fast','Slow but consistent','Hot and cold','Ghosted before'])}<label>Desired outcome:</label>${radio('tnGoal',['Keep conversation going','Ask them out','Apologize','Check if they’re okay','End things'])}${actions('sampleTextNow()','analyzeTextNow()')}<div id="tnOut" class="output"></div>`) + historyBlock('textnow'))}
function radio(name,arr){return `<div class="choices">${arr.map((x,i)=>`<label class="choice"><input type="radio" name="${name}" value="${esc(x)}" ${i===0?'checked':''}><span>${esc(x)}</span></label>`).join('')}</div>`}
function val(n){return document.querySelector(`input[name="${n}"]:checked`)?.value||''}
function sampleTextNow(){set('tnWhat','They seemed interested after we met and asked about my weekend.');set('tnLast','Had a great time yesterday :)');pick('tnWho','Them');set('tnTime','1-6 hours');set('tnStage','Just met');pick('tnPattern','They usually reply fast');pick('tnGoal','Ask them out')}
function set(id,v){document.getElementById(id).value=v} function pick(n,v){const x=[...document.querySelectorAll(`input[name="${n}"]`)].find(i=>i.value===v);if(x)x.checked=true}
function analyzeTextNow(){
 const who=val('tnWho'),time=val('tnTime'),stage=val('tnStage'),pattern=val('tnPattern'),goal=val('tnGoal');let verdict='WAIT',cls='v-yellow',e=[];
 if(pattern==='Ghosted before'&&time==='1+ weeks'&&who==='Me'){verdict="DON'T TEXT";cls='v-red';e=['They have a prior ghosting pattern.','You sent the last message and the gap is long.']}
 else if(who==='Them'&&time==='Less than 1 hour'&&stage==='Exclusive'){verdict='WAIT';e=['They sent the last message.','Less than an hour is usually too little information to infer a problem.']}
 else if(stage==='Just met'&&who==='Them'&&time==='1-6 hours'&&goal==='Ask them out'){verdict='TEXT NOW';cls='v-green';e=['They sent the last message.','A 1–6 hour gap after a positive first interaction is not inherently concerning.']}
 else if(stage==='Ex'&&who==='Me'){verdict=time==='1+ weeks'?"DON'T TEXT":'WAIT';cls=verdict==="DON'T TEXT"?'v-red':'v-yellow';e=['An ex-relationship can make impulsive contact emotionally costly.','You sent the last message.']}
 else if(goal==='Apologize'&&who==='Me'&&['Less than 1 hour','1-6 hours','6-24 hours'].includes(time)){verdict='WAIT';e=['You already sent the last message.','A little processing time can make an apology clearer and less reactive.']}
 else {verdict=who==='Them'?'WAIT':'SEND A DIFFERENT MESSAGE';cls=who==='Them'?'v-yellow':'v-orange';e=['The timing and sender pattern do not create a strong reason to rush.','A lower-pressure message is preferable to repeated checking.']}
 const msgs=['Hey, how’s your day going?','Hey! I enjoyed talking with you — would love to keep the conversation going.','Quick question: are you free sometime this week?'];
 document.getElementById('tnOut').innerHTML=`<div class="verdict ${cls}">${verdict}</div>${sec('EVIDENCE','<ul>'+e.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>')}${sec('WHAT REMAINS UNCERTAIN','<p>We cannot know their current attention, feelings, schedule, or intentions from timing alone.</p>')}${sec('WHAT COULD GO WRONG','<p>Repeated messages can increase pressure; waiting can also be misread if there is an actual practical issue. Keep the next step proportionate.</p>')}${sec('BEST NEXT STEP',`<p>${verdict==="DON'T TEXT"?'Do not send another message right now.':verdict==='WAIT'?'Give the conversation room and reassess later.':'Send one clear, low-pressure message and then let them respond.'}</p>`)}${(verdict==='TEXT NOW'||verdict==='SEND A DIFFERENT MESSAGE')?sec('SUGGESTED MESSAGES',messages(msgs,['Casual','Warm','Direct'])):''}`;
 saveHistory('textnow',{what:document.getElementById('tnWhat').value,last:document.getElementById('tnLast').value,who,time,stage,pattern,goal},{verdict,e})
}

function sayHTML(){return shell('say','What Should I Say?','Clear communication without overexplaining.',panel(`<label>What happened?</label><textarea id="sayWhat"></textarea><label>Who are you speaking to?</label><select id="sayWho">${['Crush','Partner','Ex','Friend','Family','Coworker'].map(x=>`<option>${x}</option>`).join('')}</select><label>What do you want them to understand?</label><textarea id="sayUnderstand"></textarea><label>Desired outcome:</label><select id="sayGoal">${['Apologize','Ask out','Set boundary','Express disappointment','Ask about distance','Reconnect','End relationship'].map(x=>`<option>${x}</option>`).join('')}</select><label>Desired tone:</label>${radio('sayTone',['Warm','Calm/Confident','Direct'])}${actions('sampleSay()','analyzeSay()')}<div id="sayOut" class="output"></div>`) + historyBlock('say'))}
const baseTemplates={Apologize:"I want to own what I did. I know [action] affected you, and I’m sorry. Here’s what I’ll do differently: [change].", 'Ask out':"I’ve really enjoyed getting to know you. Would you want to grab coffee this weekend?",'Set boundary':"I need to be honest about something. When [behavior] happens, I feel [emotion]. Going forward, I need [boundary].",'Express disappointment':"I was looking forward to [thing]. When it didn’t happen, I felt [emotion]. Can we talk about what happened?",'Ask about distance':"I’ve noticed we haven’t been talking as much lately. Is everything okay? I’m here if you want to talk.",Reconnect:"I’ve been thinking about you. I know things have been [situation], but I’d love to catch up if you’re open to it.",'End relationship':"I’ve been doing a lot of thinking, and I believe it’s best for both of us to go our separate ways. I care about you, and I want us both to find what we need."};
function sampleSay(){set('sayWhat','We had plans and they cancelled twice.');set('sayUnderstand','I want them to understand that consistency matters to me.');set('sayWho','Partner');set('sayGoal','Set boundary');pick('sayTone','Calm/Confident')}
function adapt(t,tone){if(tone==='Warm')return 'Hey, '+t+' I care about us and appreciate you hearing me out.';if(tone==='Direct')return t.replace(/I want to be honest about something\.?/i,'').replace(/I believe /g,'');return t}
function analyzeSay(){const goal=document.getElementById('sayGoal').value,tone=val('sayTone'),u=document.getElementById('sayUnderstand').value,t=adapt(baseTemplates[goal],tone);const arr=[t,t.replace(/\[action\]/,'what happened').replace(/\[behavior\]/,'this pattern').replace(/\[emotion\]/,'disappointed').replace(/\[boundary\]/,'more consistency').replace(/\[thing\]/,'our plans'),tone==='Warm'?'Hey, I care about you, and I’d like us to talk about this openly.':t];document.getElementById('sayOut').innerHTML=sec('MESSAGES',messages(arr,['Option 1','Option 2','Option 3']))+sec('WHY THIS WORDING WORKS',`<p>It focuses on the situation, your meaning, and a concrete next step instead of guessing motives. Desired outcome: ${esc(goal)}.</p>`)+sec('WHAT NOT TO SAY','<div class="warn">Avoid accusations, mind-reading, threats, scorekeeping, or sending a long message while highly activated.</div>');saveHistory('say',{what:document.getElementById('sayWhat').value,who:document.getElementById('sayWho').value,understand:u,goal,tone},{messages:arr})}

function stoppedHTML(){return shell('stopped','Why Did They Stop Replying?','Find the observable shift before building a story around it.',panel(`<label>Recent conversation (last 10–20 messages)</label><textarea id="stopInput" style="min-height:190px"></textarea>${actions('sampleStopped()','analyzeStopped()')}<div id="stopOut" class="output"></div>`) + historyBlock('stopped'))}
function sampleStopped(){set('stopInput',"Me: How was your day?\\nThem: Pretty good! Busy though.\\nMe: Want to grab coffee this weekend?\\nThem: Sorry, I’m busy this week. Later?\\nMe: Sure, let me know.\\nThem: k.")}
function analyzeStopped(){const s=document.getElementById('stopInput').value, lines=s.split('\\n').filter(Boolean), last=lines[lines.length-1]||'', unanswered=/\\?/.test(s)&&!/\?/.test(last), busy=/busy|later|work|sorry/i.test(s), lengths=lines.map(x=>x.length);let changes=[];if(lines.length>=4)changes.push('The exchange has moved from fuller replies toward a shorter final reply.');if(last.length<10)changes.push('The most recent message is notably brief.');if(unanswered)changes.push('There appears to be a question or invitation that was not directly answered.');if(!changes.length)changes.push('There is not enough visible evidence of a clear pattern shift.');let poss=[['They became busy or distracted','Medium'],['Their interest or availability changed','Low'],['They prefer a shorter texting style','Low'],['They intend to reply later but have not prioritized it','Medium']];if(busy)poss.unshift(['They explicitly indicated being busy or wanting to continue later','High']);document.getElementById('stopOut').innerHTML=sec('WHAT CHANGED','<ul>'+changes.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>')+sec('WHAT WE KNOW',`<ul><li>${lines.length} conversation lines were provided.</li><li>The last visible message was: “${esc(last)}”</li></ul>`)+sec('POSSIBLE EXPLANATIONS','<ul>'+poss.slice(0,5).map(x=>`<li>${esc(x[0])}<span class="badge ${x[1].toLowerCase()}">${x[1]}</span></li>`).join('')+'</ul>')+sec('WHAT WE CANNOT KNOW','<p>We cannot know why they stopped, what they feel, or whether this is permanent from the conversation alone.</p>')+sec('BEST NEXT MOVE','<p>Do not fill the silence with repeated messages. If a follow-up is genuinely needed, send one clear, low-pressure message and then give them room.</p>');saveHistory('stopped',{conversation:s},{changes,possible:poss})}

function dateHTML(){return shell('date','First Date Coach','Practical help before, during, and after the date.',panel(`<div class="tabs"><button class="tab active" onclick="dateTab('before',this)">BEFORE</button><button class="tab" onclick="dateTab('during',this)">DURING</button><button class="tab" onclick="dateTab('after',this)">AFTER</button></div><div id="dateContent"></div>`))}
const dateData={before:[['Conversation starters',['What’s something you’ve been enjoying lately?','What would a perfect free Saturday look like for you?','What’s a place you’d love to visit?','What are you currently curious about?','What’s a small thing that always makes your day better?']],['Natural follow-ups',['What got you into that?','What do you like about it?','How did that happen?','Would you do it again?','What’s the story behind that?']],['Things to avoid',['Interview-style rapid fire','Oversharing very personal history too early','Talking only about yourself','Testing them with trick questions','Ignoring a stated boundary']],['Confidence prep',['Breathe slowly.','Wear something you feel comfortable in.','Aim for curiosity, not performance.','Remember you are also evaluating compatibility.']]],during:[['Starting conversation',['I’m glad we finally made this happen.','How’s your week been so far?','I was curious to hear more about what you mentioned earlier.']],['Recovering from silence',['I just realized we haven’t talked about travel yet — are you a planner or spontaneous traveler?','Okay, random question: what’s your comfort-food pick?','Let’s settle an important debate: early bird or night owl?']],['Showing interest',['I like hearing you talk about that.','You have a really easy energy to talk to.','I appreciate how thoughtfully you explained that.']],['Ending naturally',['I’ve had a really nice time.','I should get going, but I’m glad we did this.','Thanks for tonight — I’d be happy to do this again.']]],after:[]};
function dateTab(tab,btn){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active');const c=document.getElementById('dateContent');if(tab==='after'){c.innerHTML=`<label>Describe what happened:</label><textarea id="afterInput"></textarea><div class="actions"><button class="btn primary" onclick="analyzeAfter()">Analyze</button><button class="btn secondary" onclick="set('afterInput','We talked easily, laughed a lot, and they suggested we do something again next week.')">Load Sample Scenario</button></div><div id="afterOut" class="output"></div>`;return}c.innerHTML=dateData[tab].map(x=>sec(x[0],'<ul>'+x[1].map(y=>`<li>${esc(y)}</li>`).join('')+'</ul>')).join('')+(tab==='during'?`<button class="btn secondary" onclick="this.nextElementSibling.classList.toggle('hidden')">We have nothing to say</button><div class="info hidden" style="margin-top:10px">Try: favorite local food, a recent win, a place you’d revisit, something you want to learn, or “What’s been the best part of your week?”</div>`:'')}
function analyzeAfter(){const s=document.getElementById('afterInput').value,l=s.toLowerCase();const pos=/laugh|nice|enjoy|again|suggest|fun|smil/.test(l),conc=/rude|cancel|late|uncomfortable|pressur|boundary/.test(l);document.getElementById('afterOut').innerHTML=`<div class="signal-list"><div class="signal-box"><h5>POSITIVE SIGNALS</h5><p>${pos?'There are observable signs of enjoyment or continued interest.':'None clearly identified from the description.'}</p></div><div class="signal-box"><h5>AMBIGUOUS SIGNALS</h5><p>One date cannot establish long-term intent.</p></div><div class="signal-box"><h5>POSSIBLE CONCERNS</h5><p>${conc?'The description includes a possible concern worth taking seriously.':'No specific concern is evident from the supplied description.'}</p></div></div>${sec('SUGGESTED NEXT STEP','<p>Look for consistency over time. If you enjoyed the date, a simple “I had a good time” is enough.</p>')}`}

function signalsHTML(){return shell('signals','Date Signal Checker','A simple pattern check—not a mind-reading machine.',panel(`<label>1. Who usually initiates conversation?</label>${radio('sg1',['Mostly me','We both do','Mostly them'])}<label>2. Are their responses consistent?</label>${radio('sg2',['Yes','Sometimes','No'])}<label>3. Do they make plans and follow through?</label>${radio('sg3',['Yes','Sometimes','No'])}<label>4. Do they show interest in learning about you?</label>${radio('sg4',['Yes','Sometimes','No'])}<label>5. Do they remember details you share?</label>${radio('sg5',['Yes','Sometimes','No'])}<label>6. Do they respect your boundaries?</label>${radio('sg6',['Yes','Sometimes','No'])}${actions('sampleSignals()','analyzeSignals()')}<div id="sgOut" class="output"></div>`) + historyBlock('signals'))}
function sampleSignals(){['sg1','sg2','sg3','sg4','sg5','sg6'].forEach((n,i)=>pick(n,['We both do','Sometimes','Yes','Yes','Sometimes','Yes'][i]))}
function analyzeSignals(){let pos=[],amb=[],con=[];const q=[['sg1','Mostly them','Mostly me','They often initiate contact.'],['sg2','Yes','No','Their responses are consistent.'],['sg3','Yes','No','They make plans and follow through.'],['sg4','Yes','No','They show curiosity about you.'],['sg5','Yes','No','They remember details you share.'],['sg6','Yes','No','They respect your boundaries.']];q.forEach(([n,p,c,text])=>{const v=val(n);if(v===p)pos.push(text);else if(v===c)con.push('This pattern may indicate low reciprocity or reliability.');else amb.push('This area is mixed or unclear.')});document.getElementById('sgOut').innerHTML=`<div class="signal-list"><div class="signal-box"><h5>POSITIVE SIGNALS</h5><p>${pos.join(' ')||'None selected.'}</p></div><div class="signal-box"><h5>AMBIGUOUS SIGNALS</h5><p>${amb.join(' ')||'None.'}</p></div><div class="signal-box"><h5>CONCERNING SIGNALS</h5><p>${con.join(' ')||'None clearly identified.'}</p></div></div>${sec('WHAT WE CAN REASONABLY INFER',`<p>${pos.length>=4?'There are several encouraging observable patterns.':con.length>=3?'There are multiple areas worth paying attention to.':'The signals are mixed; consistency over time matters more than one interaction.'}</p>`)}${sec('WHAT WE CANNOT KNOW','<p>These answers cannot prove attraction, commitment, or future behavior.</p>')}${sec('WHAT TO DO NEXT','<p>Match the level of effort you are receiving, communicate clearly, and pay attention to repeated patterns.</p>')}`;saveHistory('signals',{answers:q.map(x=>val(x[0]))},{positive:pos,ambiguous:ambiguous=amb,concerning:con})}

function messupHTML(){return shell('messup','Did I Mess This Up?','Separate what happened from what anxiety added.',panel(`<label>What did you say or do?</label><textarea id="muWhat"></textarea><label>How did they respond?</label><textarea id="muResp"></textarea>${actions('sampleMessup()','analyzeMessup()')}<div id="muOut" class="output"></div>`) + historyBlock('messup'))}
function sampleMessup(){set('muWhat','I sent a second message because I was excited about our plan.');set('muResp','Haha no worries! What time should we meet?')}
function analyzeMessup(){const a=document.getElementById('muWhat').value,b=document.getElementById('muResp').value,l=b.toLowerCase();let cls='Probably Fine',vc='v-green';if(/\bk\b|\bok\b/.test(l)||b.length<8){cls='Unclear';vc='v-yellow'}if(/angry|stop|leave me|don’t|dont|space/.test(l)){cls='Worth Repairing';vc='v-orange'}const repair="Hey — I realize that may have come across a little much. No pressure at all; I’m happy to give you space.";document.getElementById('muOut').innerHTML=sec('FACTS',`<p>${esc(a)}<br>${esc(b)}</p>`)+sec('ASSUMPTIONS','<p>You may be adding meaning that is not explicitly present in the response.</p>')+sec('POSSIBLE INTERPRETATIONS','<ul><li>They understood it normally.</li><li>They noticed it but were not bothered.</li><li>They may have had a different reaction than the one you fear.</li></ul>')+`<div class="verdict ${vc}">${cls}</div>`+(cls==='Worth Repairing'?sec('REPAIR MESSAGE',`<div class="message">${esc(repair)}<button class="copy" onclick="copyText(${JSON.stringify(repair)})"><i class="fa-regular fa-copy"></i></button></div>`):'')+sec('WHAT TO DO NEXT','<p>Do not apologize repeatedly. Use the other person’s actual response and subsequent behavior as evidence.</p>');saveHistory('messup',{said:a,response:b},{classification:cls})}

function crushHTML(){return shell('crush','What Do I Say to My Crush?','Choose the situation, add context, and keep it natural.',panel(`<div class="grid" id="crushChoices" style="grid-template-columns:repeat(4,1fr)">${['First message','Continue conversation','Ask them out','Tell them I like them','They seem distant','They rejected me','Apologize','Reconnect'].map((x,i)=>`<button class="btn ghost" style="min-height:55px" onclick="selectCrush(${i})">${x}</button>`).join('')}</div><div id="crushForm" class="hidden"><label>Situation</label><input id="crushSituation" readonly><label>Brief context</label><textarea id="crushContext"></textarea><div class="actions"><button class="btn primary" onclick="analyzeCrush()">Generate</button><button class="btn secondary" onclick="sampleCrush()">Load Sample Scenario</button><button class="btn ghost" onclick="naturalCrush()">Make it sound more natural</button></div><div id="crushOut" class="output"></div></div>`) + historyBlock('crush'))}
const crushTemplates=['Hey! I’ve been meaning to say hi. How’s your week going?','I enjoyed talking with you the other day. What are you up to this weekend?','I’ve liked getting to know you. Would you want to grab coffee sometime?','I like you, and I wanted to be honest about it. No pressure — I just wanted you to know.','Hey, I’ve noticed we haven’t talked as much lately. Everything okay?','Thanks for being honest. I respect your answer and wish you well.','Hey, I’ve thought about what happened, and I’m sorry for my part in it.','Hey, I was thinking about you. If you’re open to it, I’d love to catch up.'];
let crushIndex=0;
function selectCrush(i){crushIndex=i;document.getElementById('crushForm').classList.remove('hidden');set('crushSituation',['First message','Continue conversation','Ask them out','Tell them I like them','They seem distant','They rejected me','Apologize','Reconnect'][i]);set('crushContext','')}
function sampleCrush(){set('crushContext',crushIndex===2?'We had a good conversation after class and they laughed a lot.':'We have talked a few times and I want to keep things easy and natural.')}
function analyzeCrush(){let b=crushTemplates[crushIndex],ctx=document.getElementById('crushContext').value;const arr=[b,b.replace('Hey!','Hey —').replace('coffee','coffee or a walk'),b+''];document.getElementById('crushOut').innerHTML=sec('MESSAGES',messages(arr,['Casual','Confident','Warm']));saveHistory('crush',{situation:document.getElementById('crushSituation').value,context:ctx},{messages:arr})}
function naturalCrush(){const out=document.getElementById('crushOut');if(out)out.innerHTML=out.innerHTML.replace(/I’ve/g,"I've").replace(/I’d/g,"I'd").replace(/Would you want to/g,"Want to");toast('Made more natural')}

function ignoredHTML(){return shell('ignored','Am I Being Ignored?','Assess the pattern without turning uncertainty into certainty.',panel(`<label>How many messages have you sent without a reply?</label><input id="igN" type="number" min="0" value="2"><label>How long has it been since they last replied?</label><select id="igTime">${['<1hr','1-6hr','6-24hr','1-3d','3-7d','1+w'].map(x=>`<option>${x}</option>`).join('')}</select><label>Who usually starts conversations?</label>${radio('igStart',['Mostly me','We both do','Mostly them'])}<label>Has their reply speed changed recently?</label>${radio('igSpeed',['Yes, slower','No, same','Yes, faster'])}<label>Have they left messages on read?</label>${radio('igRead',['Yes','No','Not sure'])}<label>Any recent life changes you know of? (optional)</label><textarea id="igLife"></textarea>${actions('sampleIgnored()','analyzeIgnored()')}<div id="igOut" class="output"></div>`) + historyBlock('ignored'))}
function sampleIgnored(){set('igN',3);set('igTime','3-7d');pick('igStart','Mostly me');pick('igSpeed','Yes, slower');pick('igRead','Yes');set('igLife','They recently started a demanding new job.')}
function analyzeIgnored(){let score=0,n=+document.getElementById('igN').value,time=document.getElementById('igTime').value,start=val('igStart'),speed=val('igSpeed'),read=val('igRead');score+=Math.min(n,5);score+={'<1hr':0,'1-6hr':1,'6-24hr':2,'1-3d':3,'3-7d':4,'1+w':5}[time];if(start==='Mostly me')score+=2;if(speed==='Yes, slower')score+=2;if(read==='Yes')score+=2;let level=score>=11?'stronger possibility':score>=6?'possible':'not enough evidence';document.getElementById('igOut').innerHTML=sec('OBSERVED PATTERN',`<p>${n} unanswered message(s), a ${esc(time)} gap, initiation is ${esc(start.toLowerCase())}, and reply speed is ${esc(speed.toLowerCase())}.</p>`)+sec('WHAT IT COULD MEAN',`<ul><li>They may be less available or less engaged.</li><li>They may be dealing with competing priorities.</li><li>The communication pattern may be changing.</li><li>There may be context you cannot see.</li></ul>`)+sec('WHAT IT DOES NOT PROVE','<p>It does not prove rejection, dislike, cheating, punishment, or intentional ignoring. Even a strong pattern is still not certainty.</p>')+sec('WHAT TO DO NEXT',`<p>Current assessment: <b>${level}</b>. Avoid sending repeated check-ins. If there is something genuinely important, send one clear message; otherwise give the pattern time to reveal itself.</p>`);saveHistory('ignored',{n,time,start,speed,read,life:document.getElementById('igLife').value},{score,level})}

function init(){renderDashboard();document.querySelector('[data-tool="dashboard"]').classList.add('active')}
init();
</script>
</body>
</html>
