<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FirstLoveGuide — Practical Toolkit for Young Adults</title>
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* RESET & BASE STYLES */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #FEF0FF 0%, #FFF0F3 100%);
      color: #2D3748;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* LAYOUT STRUCTURE */
    .app-container {
      display: flex;
      flex: 1;
      position: relative;
    }

    /* SIDEBAR */
    .sidebar {
      width: 260px;
      background-color: #FFFFFF;
      box-shadow: 2px 0 10px rgba(0,0,0,0.03);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 100;
      transition: transform 0.3s ease;
    }
    .sidebar-header {
      padding: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #F0F0F0;
    }
    .sidebar-header i {
      font-size: 24px;
      color: #9B5DE5;
    }
    .sidebar-header h1 {
      font-size: 18px;
      font-weight: 700;
      color: #1A202C;
      background: linear-gradient(45deg, #9B5DE5, #F15BB5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .nav-list {
      list-style: none;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .nav-item button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border: none;
      background: none;
      border-radius: 12px;
      color: #4A5568;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
    }
    .nav-item button:hover {
      background-color: #F7FAFC;
      color: #9B5DE5;
    }
    .nav-item button.active {
      background-color: #F3E8FF;
      color: #9B5DE5;
      font-weight: 600;
    }
    .nav-item button i {
      font-size: 16px;
      width: 20px;
      text-align: center;
    }

    /* MOBILE HEADER & OVERLAY */
    .mobile-header {
      display: none;
      height: 60px;
      background: #FFFFFF;
      padding: 0 20px;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      position: sticky;
      top: 0;
      z-index: 90;
    }
    .mobile-header .brand {
      font-weight: 700;
      font-size: 16px;
      color: #9B5DE5;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .hamburger {
      background: none;
      border: none;
      font-size: 20px;
      color: #4A5568;
      cursor: pointer;
    }
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 95;
    }

    /* MAIN CONTENT AREA */
    .main-content {
      flex: 1;
      margin-left: 260px;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* UI CARDS & COMPONENTS */
    .card {
      background: #FFFFFF;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.8);
    }
    .hero-card {
      background: linear-gradient(135deg, #FFFFFF 0%, #FAF5FF 100%);
      border: 1px solid #F3E8FF;
      text-align: center;
      padding: 36px 24px;
    }
    .hero-card h2 {
      font-size: 28px;
      font-weight: 700;
      color: #1A202C;
      margin-bottom: 8px;
    }
    .hero-card p {
      color: #718096;
      font-size: 16px;
    }

    /* GRID FOR DASHBOARD */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
    }
    .tool-card {
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
    }
    .tool-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(155, 93, 229, 0.1);
    }
    .icon-wrapper {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: #F3E8FF;
      color: #9B5DE5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .tool-card h3 {
      font-size: 18px;
      font-weight: 600;
      color: #2D3748;
    }
    .tool-card p {
      font-size: 13px;
      color: #718096;
      line-height: 1.4;
    }

    /* FORMS & INPUTS */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 18px;
    }
    .form-group label {
      font-weight: 600;
      font-size: 14px;
      color: #4A5568;
    }
    input[type="text"], textarea, select {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #E2E8F0;
      border-radius: 10px;
      font-family: inherit;
      font-size: 14px;
      color: #2D3748;
      background: #F8FAFC;
      transition: all 0.2s;
    }
    input[type="text"]:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #9B5DE5;
      background: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(155, 93, 229, 0.15);
    }
    textarea {
      resize: vertical;
      min-height: 90px;
    }
    .radio-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .radio-option {
      position: relative;
    }
    .radio-option input {
      position: absolute;
      opacity: 0;
      cursor: pointer;
    }
    .radio-label {
      display: block;
      padding: 8px 16px;
      background: #F7FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      color: #4A5568;
      cursor: pointer;
      transition: all 0.2s;
    }
    .radio-option input:checked + .radio-label {
      background: #F3E8FF;
      border-color: #9B5DE5;
      color: #9B5DE5;
      font-weight: 600;
    }

    /* BUTTONS */
    .btn {
      padding: 12px 20px;
      border-radius: 10px;
      border: none;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(45deg, #9B5DE5, #F15BB5);
      color: white;
      box-shadow: 0 4px 12px rgba(155, 93, 229, 0.25);
    }
    .btn-primary:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: #EDF2F7;
      color: #4A5568;
    }
    .btn-secondary:hover {
      background: #E2E8F0;
    }
    .btn-copy {
      background: #F3E8FF;
      color: #9B5DE5;
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 6px;
    }
    .btn-copy:hover {
      background: #E9D5FF;
    }
    .btn-row {
      display: flex;
      gap: 12px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    /* RESULTS & OUTPUT SECTIONS */
    .output-card {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      animation: fadeIn 0.3s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .banner {
      padding: 16px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 18px;
      text-align: center;
      letter-spacing: 0.5px;
    }
    .banner-green { background: #DEF7EC; color: #03543F; }
    .banner-yellow { background: #FEF08A; color: #713F12; }
    .banner-red { background: #FDE8E8; color: #9B1C1C; }
    .banner-orange { background: #FFEDD5; color: #9A3412; }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      margin-left: 8px;
    }
    .badge-low { background: #E2E8F0; color: #4A5568; }
    .badge-medium { background: #FEF08A; color: #713F12; }
    .badge-high { background: #DEF7EC; color: #03543F; }

    .result-section {
      border-bottom: 1px solid #F0F0F0;
      padding-bottom: 16px;
    }
    .result-section:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }
    .result-title {
      font-size: 12px;
      font-weight: 700;
      color: #A0AEC0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .result-body {
      font-size: 14px;
      color: #2D3748;
      line-height: 1.5;
    }
    
    .script-box {
      background: #F8FAFC;
      border-left: 4px solid #9B5DE5;
      padding: 12px 16px;
      border-radius: 0 8px 8px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
      gap: 12px;
    }
    .script-text {
      font-size: 14px;
      color: #2D3748;
      font-style: italic;
      word-break: break-word;
    }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    /* ACCORDION / HISTORY */
    .history-section {
      margin-top: 32px;
    }
    .accordion-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      cursor: pointer;
      border-top: 1px solid #E2E8F0;
      font-weight: 600;
      font-size: 14px;
      color: #4A5568;
    }
    .accordion-content {
      display: none;
      padding: 12px 0;
    }
    .accordion-content.active {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .history-item {
      background: #F8FAFC;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      border: 1px solid #EDF2F7;
    }
    .history-timestamp {
      font-size: 11px;
      color: #A0AEC0;
      margin-bottom: 4px;
    }

    /* FOOTER */
    footer {
      text-align: center;
      padding: 24px;
      color: #718096;
      font-size: 12px;
      margin-top: auto;
      line-height: 1.5;
    }

    /* TOAST */
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #2D3748;
      color: white;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.3s, transform 0.3s;
      z-index: 1000;
      pointer-events: none;
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* RESPONSIVE DESIGN */
    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
      }
      .sidebar.open {
        transform: translateX(0);
      }
      .mobile-header {
        display: flex;
      }
      .main-content {
        margin-left: 0;
        padding: 20px 16px;
      }
      .overlay.show {
        display: block;
      }
      .two-col {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- MOBILE HEADER -->
  <div class="mobile-header">
    <div class="brand">
      <i class="fa-solid fa-heart"></i>
      FirstLoveGuide
    </div>
    <button class="hamburger" id="hamburgerBtn" aria-label="Toggle Menu">
      <i class="fa-solid fa-bars"></i>
    </button>
  </div>

  <!-- OVERLAY FOR MOBILE -->
  <div class="overlay" id="overlay"></div>

  <div class="app-container">
    <!-- FIXED SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <i class="fa-solid fa-heart"></i>
        <h1>FirstLoveGuide</h1>
      </div>
      <ul class="nav-list">
        <li class="nav-item">
          <button class="nav-btn active" data-tool="dashboard">
            <i class="fa-solid fa-house"></i> Dashboard
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-btn" data-tool="text-decoder">
            <i class="fa-solid fa-message"></i> Text Decoder
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-btn" data-tool="should-text">
            <i class="fa-solid fa-paper-plane"></i> Should I Text Them?
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-btn" data-tool="the-talk">
            <i class="fa-solid fa-comments"></i> The Talk
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-btn" data-tool="jealousy-reset">
            <i class="fa-solid fa-shield-halved"></i> Jealousy Reset
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-btn" data-tool="fight-fixer">
            <i class="fa-solid fa-handshake"></i> First Fight Fixer
          </button>
        </li>
      </ul>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
      <div class="container" id="contentArea">
        <!-- Content will be injected via JS -->
      </div>

      <!-- FOOTER -->
      <footer>
        For entertainment purposes only. Not professional advice. If you're in crisis, talk to someone you trust.
      </footer>
    </main>
  </div>

  <!-- TOAST NOTIFICATION -->
  <div class="toast" id="toast">Copied to clipboard!</div>

  <script>
    /* ==========================================================================
       APP STATE & LOCAL STORAGE HANDLERS
       ========================================================================== */
    const STATE = {
      currentTool: 'dashboard'
    };

    function getHistory(toolId) {
      const data = localStorage.getItem(`firstlove_history_${toolId}`);
      return data ? JSON.parse(data) : [];
    }

    function saveHistory(toolId, item) {
      let history = getHistory(toolId);
      history.unshift({ ...item, timestamp: new Date().toLocaleString() });
      if (history.length > 30) history = history.slice(0, 30);
      localStorage.setItem(`firstlove_history_${toolId}`, JSON.stringify(history));
    }

    function clearHistory(toolId) {
      localStorage.removeItem(`firstlove_history_${toolId}`);
      renderTool(toolId);
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        showToast('Copied to clipboard!');
      });
    }

    /* ==========================================================================
       TEMPLATES & VIEWS
       ========================================================================== */
    
    // DASHBOARD VIEW
    function renderDashboard() {
      return `
        <div class="card hero-card">
          <h2>First Love Field Guide</h2>
          <p>Everything nobody teaches you about your first serious relationship.</p>
        </div>

        <div class="dashboard-grid">
          <div class="card tool-card" onclick="switchTool('text-decoder')">
            <div class="icon-wrapper"><i class="fa-solid fa-message"></i></div>
            <h3>Text Decoder</h3>
            <p>Deconstruct ambiguous texts, understand tone, and avoid overthinking.</p>
          </div>

          <div class="card tool-card" onclick="switchTool('should-text')">
            <div class="icon-wrapper"><i class="fa-solid fa-paper-plane"></i></div>
            <h3>Should I Text Them?</h3>
            <p>Get a clear verdict on reaching out without double-texting or spiraling.</p>
          </div>

          <div class="card tool-card" onclick="switchTool('the-talk')">
            <div class="icon-wrapper"><i class="fa-solid fa-comments"></i></div>
            <h3>The Talk</h3>
            <p>Scripts and strategies to define the relationship with total confidence.</p>
          </div>

          <div class="card tool-card" onclick="switchTool('jealousy-reset')">
            <div class="icon-wrapper"><i class="fa-solid fa-shield-halved"></i></div>
            <h3>Jealousy Reset</h3>
            <p>Separate facts from assumptions when social media triggers anxiety.</p>
          </div>

          <div class="card tool-card" onclick="switchTool('fight-fixer')">
            <div class="icon-wrapper"><i class="fa-solid fa-handshake"></i></div>
            <h3>First Fight Fixer</h3>
            <p>Navigate your first big disagreement gracefully and repair effectively.</p>
          </div>
        </div>
      `;
    }

    // TOOL 1: TEXT DECODER
    function renderTextDecoder() {
      const history = getHistory('text-decoder');
      return `
        <div class="card">
          <h2 style="font-size:20px; font-weight:700; margin-bottom: 6px;">Text Decoder</h2>
          <p style="color:#718096; font-size:14px; margin-bottom: 20px;">What does this message actually mean?</p>
          
          <div class="form-group">
            <label for="decoderText">Paste the message here:</label>
            <textarea id="decoderText" placeholder="e.g., 'k.', 'Sure sounds fine', 'I've just been really busy lately...'"></textarea>
          </div>

          <div class="btn-row">
            <button class="btn btn-primary" onclick="processTextDecoder()">
              <i class="fa-solid fa-magnifying-glass"></i> Decode
            </button>
            <button class="btn btn-secondary" onclick="loadSampleTextDecoder()">Load Sample Scenario</button>
          </div>
        </div>

        <div id="decoderOutput"></div>
        ${renderHistoryAccordion('text-decoder', history)}
      `;
    }

    // TOOL 2: SHOULD I TEXT THEM?
    function renderShouldText() {
      const history = getHistory('should-text');
      return `
        <div class="card">
          <h2 style="font-size:20px; font-weight:700; margin-bottom: 6px;">Should I Text Them?</h2>
          <p style="color:#718096; font-size:14px; margin-bottom: 20px;">I want to reach out but I don't know if I should.</p>
          
          <form id="shouldTextForm" onsubmit="event.preventDefault(); processShouldText();">
            <div class="form-group">
              <label>Last message sent:</label>
              <textarea id="stLastMsg" placeholder="What was the last text sent?"></textarea>
            </div>

            <div class="form-group">
              <label>Who sent it?</label>
              <div class="radio-group">
                <label class="radio-option"><input type="radio" name="stSender" value="Me" checked><span class="radio-label">Me</span></label>
                <label class="radio-option"><input type="radio" name="stSender" value="Them"><span class="radio-label">Them</span></label>
              </div>
            </div>

            <div class="form-group">
              <label>Time since contact:</label>
              <select id="stTime">
                <option value="<1hr">&lt; 1 hour</option>
                <option value="1-6hr">1 - 6 hours</option>
                <option value="6-24hr">6 - 24 hours</option>
                <option value="1-3d">1 - 3 days</option>
                <option value="3-7d">3 - 7 days</option>
                <option value="1-2w">1 - 2 weeks</option>
                <option value="2w+">2+ weeks</option>
              </select>
            </div>

            <div class="form-group">
              <label>Relationship stage:</label>
              <select id="stStage">
                <option value="Just met">Just met</option>
                <option value="Talking">Talking</option>
                <option value="Dating">Dating</option>
                <option value="Exclusive">Exclusive</option>
                <option value="It's complicated">It's complicated</option>
                <option value="Ex">Ex</option>
              </select>
            </div>

            <div class="form-group">
              <label>Recent pattern:</label>
              <div class="radio-group">
                <label class="radio-option"><input type="radio" name="stPattern" value="They reply fast" checked><span class="radio-label">They reply fast</span></label>
                <label class="radio-option"><input type="radio" name="stPattern" value="Slow but consistent"><span class="radio-label">Slow but consistent</span></label>
                <label class="radio-option"><input type="radio" name="stPattern" value="Hot and cold"><span class="radio-label">Hot and cold</span></label>
                <label class="radio-option"><input type="radio" name="stPattern" value="Ghosted before"><span class="radio-label">Ghosted before</span></label>
              </div>
            </div>

            <div class="form-group">
              <label>What do you want?</label>
              <div class="radio-group">
                <label class="radio-option"><input type="radio" name="stGoal" value="Keep talking" checked><span class="radio-label">Keep talking</span></label>
                <label class="radio-option"><input type="radio" name="stGoal" value="Ask out"><span class="radio-label">Ask out</span></label>
                <label class="radio-option"><input type="radio" name="stGoal" value="Apologize"><span class="radio-label">Apologize</span></label>
                <label class="radio-option"><input type="radio" name="stGoal" value="Check if they're okay"><span class="radio-label">Check if okay</span></label>
                <label class="radio-option"><input type="radio" name="stGoal" value="End it"><span class="radio-label">End it</span></label>
              </div>
            </div>

            <div class="btn-row">
              <button type="submit" class="btn btn-primary"><i class="fa-solid fa-calculator"></i> Analyze Situation</button>
              <button type="button" class="btn btn-secondary" onclick="loadSampleShouldText()">Load Sample Scenario</button>
            </div>
          </form>
        </div>

        <div id="shouldTextOutput"></div>
        ${renderHistoryAccordion('should-text', history)}
      `;
    }

    // TOOL 3: THE TALK
    function renderTheTalk() {
      const history = getHistory('the-talk');
      return `
        <div class="card">
          <h2 style="font-size:20px; font-weight:700; margin-bottom: 6px;">The Talk</h2>
          <p style="color:#718096; font-size:14px; margin-bottom: 20px;">Are we exclusive? What are we?</p>
          
          <form id="theTalkForm" onsubmit="event.preventDefault(); processTheTalk();">
            <div class="form-group">
              <label>How long have you been seeing each other?</label>

    // ACCORDION UI RENDERER
    function renderHistoryAccordion(toolId, history) {
      if (!history || history.length === 0) return '';
      return `
        <div class="history-section">
          <div class="accordion-header" onclick="toggleAccordion('${toolId}')">
            <span><i class="fa-solid fa-clock-rotate-left"></i> Previous Saved Analyses (${history.length})</span>

            <button class="btn btn-secondary" style="font-size:12px; padding: 4px 8px; align-self: flex-end;" onclick="clearHistory('${toolId}')">Clear History</button>
            ${history.map(item => `
              <div class="history-item">
                <div class="history-timestamp">${item.timestamp}</div>
                <div><strong>Summary:</strong> ${item.summary}</div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function toggleAccordion(toolId) {
      const content = document.getElementById(`accContent-${toolId}`);
      const icon = document.getElementById(`accIcon-${toolId}`);
      if (content.classList.contains('active')) {
        content.classList.remove('active');
        icon.className = 'fa-solid fa-chevron-down';
      } else {
        content.classList.add('active');
        icon.className = 'fa-solid fa-chevron-up';
      }
    }

    function processTextDecoder() {
      const text = document.getElementById('decoderText').value.trim();
      if (!text) return;

      const lower = text.toLowerCase();
      let literal = `The sender transmitted the literal string: "${text}"`;
      let tone = "Neutral / Unclear";
      let interpretations = [];
      let cannotKnow = "Their exact facial expression, emotional state, or what they were doing when they typed this.";
      let notAssume = "Do not assume they are secretly angry or trying to break up with you based on brevetize alone.";

      // Custom logic rules based on input text length/keywords
      if (lower === "k" || lower === "k.") {
        tone = "Extremely Brief / Potentially Dismissive";
        interpretations = [
          { text: "They were in a hurry or multi-tasking (e.g., walking, working) and sent a quick acknowledgement.", conf: "High", class: "badge-high" },
          { text: "They are feeling slightly annoyed or passive-aggressive about the previous message.", conf: "Medium", class: "badge-medium" },
          { text: "They genuinely consider 'k' an acceptable, neutral response.", conf: "Low", class: "badge-low" }
        ];
      } else if (lower.includes("busy")) {
        tone = "Polite / Apologetic / Distant";
        interpretations = [
          { text: "They are genuinely overwhelmed with real-world tasks (work, school, life).", conf: "High", class: "badge-high" },
          { text: "They are setting a soft boundary to slow down the pace of communication.", conf: "Medium", class: "badge-medium" },
          { text: "They lack the energy for deep conversation right now.", conf: "Medium", class: "badge-medium" }
        ];

        tone = text.length < 10 ? "Short / Direct" : "Detailed / Expressive";
        interpretations = [
          { text: "They mean exactly what they said at face value.", conf: "High", class: "badge-high" },
          { text: "They are matching your energy or tone from prior exchanges.", conf: "Medium", class: "badge-medium" },
          { text: "They are subtly signaling their current mood or availability.", conf: "Low", class: "badge-low" }
        ];

          <div class="result-section">
            <div class="result-title">Confidence Action (Right Now)</div>
            <div class="result-body">Put your phone in another room. Go for a 15-minute walk, do 20 pushups, or listen to a favorite playlist to reset your nervous system.</div>
          </div>

          <div class="result-section">
            <div class="result-title">If You Need To Talk About It (Non-Accusatory Script)</div>
            <div class="result-body">
              <div class="script-box">
                <span class="script-text">"${script}"</span>
                <button class="btn btn-copy" onclick="copyToClipboard('${script}')">Copy</button>
              </div>
            </div>
          </div>
        </div>
      `;

      document.getElementById('jealousyOutput').innerHTML = html;
      saveHistory('jealousy-reset', { summary: `Jealousy Reset (Fear: ${fear})` });
    }

    // 5. FIRST FIGHT FIXER LOGIC
    function loadSampleFightFixer() {
      document.getElementById('ffHappened').value = "They cancelled our Friday night date last minute because they were tired from work.";
      document.getElementById('ffISaid').value = "I said 'You never make time for me' and stopped replying to their texts.";
      document.getElementById('ffTheySaid').value = "They said I was being unfair and demanding, then went quiet.";
      document.getElementById('ffHurtMe').value = "Felt like an afterthought and not prioritized.";
      document.getElementById('ffHurtThem').value = "Felt criticized and unappreciated after an exhausting work week.";
      document.querySelector('input[name="ffRepair"][value="Yes"]').checked = true;
    }

    function processFightFixer() {
      const hurtMe = document.getElementById('ffHurtMe').value || "feeling unheard";
      const hurtThem = document.getElementById('ffHurtThem').value || "feeling blamed";

      const textScript = "Hey, I hate how we left things earlier. I reacted out of frustration because I was excited to see you, but I shouldn't have snapped. Let's reset when you're ready?";
      const talkScript = "Hey, when you're free, I'd love to sit down and talk through what happened calmly. I really value us and want to understand your perspective.";

      const html = `
        <div class="card output-card">
          <div class="result-section">
            <div class="result-title">What The Fight Was Really About</div>
            <div class="result-body">This fight wasn't just about the surface event—it was a clash between your need for connection and their need for personal grace/recharging.</div>
          </div>

          <div class="result-section">
            <div class="result-title">What You May Have Needed</div>
            <div class="result-body"><strong>Reframed:</strong> Reassurance, quality time, and feeling prioritized in their schedule (${hurtMe}).</div>
          </div>

          <div class="result-section">
            <div class="result-title">What They May Have Needed</div>
            <div class="result-body"><strong>Reframed:</strong> Understanding, relief from pressure, and freedom to rest (${hurtThem}).</div>
          </div>

          <div class="result-section">
            <div class="result-title">Your Part To Own</div>
            <div class="result-body">Own the way you reacted under stress without invalidating your core feelings. (e.g., using absolute terms like "you never" or using silence as punishment).</div>
          </div>

          <div class="result-section">
            <div class="result-title">Repair Message (Text)</div>
            <div class="result-body">
              <div class="script-box">
                <span class="script-text">"${textScript}"</span>
                <button class="btn btn-copy" onclick="copyToClipboard('${textScript}')">Copy</button>
              </div>
            </div>
          </div>

          <div class="result-section">
            <div class="result-title">If You Want To Talk In Person</div>
            <div class="result-body">
              <div class="script-box">
                <span class="script-text">"${talkScript}"</span>
                <button class="btn btn-copy" onclick="copyToClipboard('${talkScript}')">Copy</button>
              </div>
            </div>
          </div>

          <div class="result-section">
            <div class="result-title">If You Need Space First</div>
            <div class="result-body">It's okay to wait! Send a quick text: <em>"I want to talk this through, but I need an hour to clear my head first so we can speak calmly."</em></div>
          </div>
        </div>
      `;

      document.getElementById('fightOutput').innerHTML = html;
      saveHistory('fight-fixer', { summary: `Fight Repair Plan` });
    }

    /* ==========================================================================
       ROUTING & UI NAVIGATION
       ========================================================================== */
    function renderTool(toolId) {
      const container = document.getElementById('contentArea');
      STATE.currentTool = toolId;

      // Update sidebar state
      document.querySelectorAll('.nav-btn').forEach(btn => {
        if (btn.dataset.tool === toolId) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      // Render content view
      switch (toolId) {
        case 'dashboard':
          container.innerHTML = renderDashboard();
          break;
        case 'text-decoder':
          container.innerHTML = renderTextDecoder();
          break;
        case 'should-text':
          container.innerHTML = renderShouldText();
          break;
        case 'the-talk':
          container.innerHTML = renderTheTalk();
          break;
        case 'jealousy-reset':
          container.innerHTML = renderJealousyReset();
          break;
        case 'fight-fixer':
          container.innerHTML = renderFightFixer();
          break;
        default:
          container.innerHTML = renderDashboard();
      }

      window.scrollTo(0, 0);
    }

    function switchTool(toolId) {
      closeMobileSidebar();
      renderTool(toolId);
    }

    // MOBILE SIDEBAR HANDLERS
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    const hamburgerBtn = document.getElementById('hamburgerBtn');

    function openMobileSidebar() {
      sidebar.classList.add('open');
      overlay.classList.add('show');
    }

    function closeMobileSidebar() {
      sidebar.classList.remove('open');
      overlay.classList.remove('show');
    }

    /* ==========================================================================
       INITIALIZATION
       ========================================================================== */
    document.addEventListener('DOMContentLoaded', () => {
      // Nav Click Listeners
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const tool = e.currentTarget.dataset.tool;
          switchTool(tool);
        });
      });

      // Mobile Menu Listeners
      hamburgerBtn.addEventListener('click', openMobileSidebar);
      overlay.addEventListener('click', closeMobileSidebar);

      // Initial Render
      renderTool('dashboard');
    });
  </script>
</body>
</html>
