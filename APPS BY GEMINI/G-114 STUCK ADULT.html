<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StuckAdult — Practical Toolkit for Direction & Momentum</title>
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* RESET & BASE STYLES */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary: #3A0CA3;
      --primary-light: #4CC9F0;
      --primary-soft: #EEF2FF;
      --secondary: #F4A261;
      --secondary-hover: #E76F51;
      --bg-start: #F8F9FA;
      --bg-end: #FFF5EB;
      --text-main: #2B2D42;
      --text-muted: #6C757D;
      --card-bg: #FFFFFF;
      --border-color: #E9ECEF;
      --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.07), 0 4px 6px -2px rgba(0, 0, 0, 0.03);
      --radius-xl: 1rem;
      --radius-lg: 0.75rem;
      --radius-md: 0.5rem;
      --sidebar-width: 250px;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.6;
    }

    /* LAYOUT STRUCTURE */
    .app-container {
      display: flex;
      flex: 1;
      position: relative;
    }

    /* SIDEBAR NAVIGATION */
    .sidebar {
      width: var(--sidebar-width);
      background-color: var(--card-bg);
      border-right: 1px solid var(--border-color);
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-sm);
      transition: transform 0.3s ease;
    }

    .sidebar-header {
      padding: 1.5rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-icon {
      background-color: var(--primary-soft);
      color: var(--primary);
      width: 40px;
      height: 40px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
    }

    .brand-title {
      font-weight: 700;
      font-size: 1.25rem;
      color: var(--primary);
      letter-spacing: -0.02em;
    }

    .nav-links {
      list-style: none;
      padding: 1rem 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .nav-item button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      border: none;
      background: transparent;
      border-radius: var(--radius-lg);
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
    }

    .nav-item button:hover {
      background-color: var(--bg-start);
      color: var(--primary);
    }

    .nav-item button.active {
      background-color: var(--primary);
      color: white;
    }

    .nav-item button i {
      width: 20px;
      text-align: center;
    }

    /* MOBILE NAVIGATION */
    .mobile-header {
      display: none;
      background: var(--card-bg);
      padding: 1rem;
      border-bottom: 1px solid var(--border-color);
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 90;
      box-shadow: var(--shadow-sm);
    }

    .hamburger-btn {
      background: none;
      border: none;
      font-size: 1.25rem;
      color: var(--text-main);
      cursor: pointer;
      padding: 0.5rem;
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.4);
      z-index: 95;
      backdrop-filter: blur(2px);
    }

    /* MAIN CONTENT AREA */
    .main-wrapper {
      flex: 1;
      margin-left: var(--sidebar-width);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      transition: margin-left 0.3s ease;
    }

    .content-container {
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      flex: 1;
    }

    /* UI CARDS & PANELS */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-sm);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      border: 1px solid var(--border-color);
    }

    .card-header {
      margin-bottom: 1.25rem;
    }

    .tool-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.5rem;
    }

    .tool-problem {
      color: var(--text-muted);
      font-style: italic;
      background-color: var(--bg-start);
      padding: 0.75rem 1rem;
      border-radius: var(--radius-md);
      border-left: 3px solid var(--secondary);
      font-size: 0.95rem;
    }

    /* FORM CONTROLS */
    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
      color: var(--text-main);
    }

    .form-control {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--text-main);
      background-color: #FAFAFA;
      transition: all 0.2s ease;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--primary);
      background-color: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(58, 12, 163, 0.1);
    }

    textarea.form-control {
      min-height: 90px;
      resize: vertical;
    }

    .checkbox-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.875rem;
      padding: 0.5rem;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      cursor: pointer;
      background: white;
      user-select: none;
      transition: background 0.15s ease;
    }

    .checkbox-label:hover {
      background-color: var(--primary-soft);
    }

    .checkbox-label input[type="checkbox"] {
      accent-color: var(--primary);
    }

    .slider-container {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .slider-container input[type="range"] {
      flex: 1;
      accent-color: var(--primary);
    }

    .slider-value {
      font-weight: 700;
      color: var(--primary);
      width: 2rem;
      text-align: center;
    }

    .slider-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    /* BUTTONS */
    .button-group {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-top: 1.5rem;
    }

    .btn {
      padding: 0.75rem 1.25rem;
      border-radius: var(--radius-lg);
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background-color: #2D0980;
      box-shadow: 0 4px 12px rgba(58, 12, 163, 0.25);
    }

    .btn-secondary {
      background-color: var(--secondary);
      color: white;
    }

    .btn-secondary:hover {
      background-color: var(--secondary-hover);
    }

    .btn-outline {
      background-color: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
    }

    .btn-outline:hover {
      background-color: var(--bg-start);
      border-color: var(--text-muted);
    }

    .btn-sm {
      padding: 0.4rem 0.75rem;
      font-size: 0.85rem;
    }

    /* OUTPUT BOXES */
    .output-card {
      background-color: #FFFFFF;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      padding: 1.5rem;
      margin-top: 2rem;
      box-shadow: var(--shadow-md);
      position: relative;
    }

    .output-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border-color);
    }

    .output-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary);
    }

    .output-section {
      margin-bottom: 1.25rem;
    }

    .output-section:last-child {
      margin-bottom: 0;
    }

    .output-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 700;
      color: var(--secondary-hover);
      margin-bottom: 0.25rem;
    }

    .output-content {
      font-size: 0.95rem;
      color: var(--text-main);
      background-color: var(--primary-soft);
      padding: 0.85rem 1rem;
      border-radius: var(--radius-md);
      border-left: 3px solid var(--primary);
    }

    /* DASHBOARD GRID */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.25rem;
      margin-top: 1.5rem;
    }

    .dash-card {
      background: white;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      padding: 1.25rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .dash-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
      border-color: var(--primary-light);
    }

    .dash-card-icon {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-lg);
      background-color: var(--primary-soft);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
    }

    .dash-card-title {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--primary);
    }

    .dash-card-desc {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    /* ENERGY MAP VISUAL */
    .energy-bar-container {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin: 1rem 0;
    }

    .energy-row {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .energy-label {
      width: 90px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .energy-track {
      flex: 1;
      height: 12px;
      background: var(--border-color);
      border-radius: 6px;
      overflow: hidden;
    }

    .energy-fill {
      height: 100%;
      border-radius: 6px;
      transition: width 0.4s ease;
    }

    /* HISTORY ACCORDION */
    .history-section {
      margin-top: 2rem;
      border-top: 1px solid var(--border-color);
      padding-top: 1rem;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
      padding: 0.5rem 0;
    }

    .history-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .history-list {
      display: none;
      margin-top: 1rem;
      gap: 0.75rem;
      flex-direction: column;
    }

    .history-list.open {
      display: flex;
    }

    .history-item {
      background-color: var(--bg-start);
      border: 1px solid var(--border-color);
      padding: 0.75rem 1rem;
      border-radius: var(--radius-md);
      font-size: 0.875rem;
    }

    .history-item-date {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }

    /* TOAST NOTIFICATION */
    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background-color: var(--primary);
      color: white;
      padding: 0.75rem 1.25rem;
      border-radius: var(--radius-lg);
      font-size: 0.9rem;
      font-weight: 500;
      box-shadow: var(--shadow-md);
      z-index: 1000;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s ease;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* FOOTER */
    footer {
      background-color: var(--card-bg);
      border-top: 1px solid var(--border-color);
      padding: 1.5rem;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: auto;
    }

    /* RESPONSIVE DESIGN */
    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .mobile-header {
        display: flex;
      }

      .sidebar-overlay.open {
        display: block;
      }

      .main-wrapper {
        margin-left: 0;
      }

      .content-container {
        padding: 1.25rem 1rem;
      }

      .dashboard-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- MOBILE HEADER -->
    <header class="mobile-header">
      <div style="display: flex; align-items: center; gap: 0.5rem;">
        <i class="fa-solid fa-compass" style="color: var(--primary); font-size: 1.25rem;"></i>
        <span class="brand-title">StuckAdult</span>
      </div>
      <button class="hamburger-btn" id="hamburgerBtn" aria-label="Toggle navigation">
        <i class="fa-solid fa-bars"></i>
      </button>
    </header>

    <!-- OVERLAY FOR MOBILE SIDEBAR -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand-icon">
          <i class="fa-solid fa-compass"></i>
        </div>
        <span class="brand-title">StuckAdult</span>
      </div>
      <nav style="flex: 1; overflow-y: auto;">
        <ul class="nav-links">
          <li class="nav-item">
            <button class="active" data-tool="dashboard">
              <i class="fa-solid fa-house"></i>
              <span>Dashboard</span>
            </button>
          </li>
          <li class="nav-item">
            <button data-tool="comparison">
              <i class="fa-solid fa-masks-theater"></i>
              <span>Comparison Detox</span>
            </button>
          </li>
          <li class="nav-item">
            <button data-tool="direction">
              <i class="fa-solid fa-map-location-dot"></i>
              <span>Direction Finder</span>
            </button>
          </li>
          <li class="nav-item">
            <button data-tool="energy">
              <i class="fa-solid fa-battery-half"></i>
              <span>Energy Audit</span>
            </button>
          </li>
          <li class="nav-item">
            <button data-tool="decision">
              <i class="fa-solid fa-scale-balanced"></i>
              <span>Decision Unsticker</span>
            </button>
          </li>
          <li class="nav-item">
            <button data-tool="weekly">
              <i class="fa-solid fa-calendar-check"></i>
              <span>Weekly Reset</span>
            </button>
          </li>
        </ul>
      </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <div class="main-wrapper">
      <main class="content-container" id="mainContent">
        <!-- VIEWS WILL BE DYNAMICALLY INJECTED HERE VIA JS -->
      </main>

      <!-- GLOBAL FOOTER -->
      <footer>
        For reflection and self-guided planning only. Not therapy or professional advice. If you're in crisis, contact a mental health professional.
      </footer>
    </div>
  </div>

  <!-- TOAST NOTIFICATION -->
  <div class="toast" id="toast">Copied to clipboard!</div>

  <script>
    /* Global Application State */
    const state = {
      activeTool: 'dashboard',
      history: {}
    };

    /* DOM Cache */
    const mainContent = document.getElementById('mainContent');
    const sidebar = document.getElementById('sidebar');
    const hamburgerBtn = document.getElementById('hamburgerBtn');
    const sidebarOverlay = document.getElementById('sidebarOverlay');
    const navButtons = document.querySelectorAll('.nav-links button');
    const toast = document.getElementById('toast');

    /* Initialize App */
    document.addEventListener('DOMContentLoaded', () => {
      setupNavigation();
      renderActiveView();
    });

    /* Navigation Handlers */
    function setupNavigation() {
      navButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          const tool = btn.getAttribute('data-tool');
          switchTool(tool);
          closeMobileSidebar();
        });
      });

      hamburgerBtn.addEventListener('click', () => {
        sidebar.classList.toggle('open');
        sidebarOverlay.classList.toggle('open');
      });

      sidebarOverlay.addEventListener('click', closeMobileSidebar);
    }

    function closeMobileSidebar() {
      sidebar.classList.remove('open');
      sidebarOverlay.classList.remove('open');
    }

    function switchTool(toolId) {
      state.activeTool = toolId;
      navButtons.forEach(btn => {
        if (btn.getAttribute('data-tool') === toolId) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
      renderActiveView();
      window.scrollTo(0, 0);
    }

    function showToast(message = 'Copied to clipboard!') {
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }

    /* History LocalStorage Helpers */
    function getHistory(toolId) {
      try {
        const data = localStorage.getItem(`stuckadult_history_${toolId}`);
        return data ? JSON.parse(data) : [];
      } catch (e) {
        return [];
      }
    }

    function saveHistoryItem(toolId, item) {
      let history = getHistory(toolId);
      history.unshift({
        id: Date.now(),
        date: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
        data: item
      });
      if (history.length > 30) history = history.slice(0, 30);
      try {
        localStorage.setItem(`stuckadult_history_${toolId}`, JSON.stringify(history));
      } catch (e) {
        console.error('Storage quota exceeded');
      }
    }

    function clearToolHistory(toolId) {
      localStorage.removeItem(`stuckadult_history_${toolId}`);
      renderActiveView();
      showToast('History cleared');
    }

    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        showToast('Analysis copied to clipboard!');
      }).catch(() => {
        showToast('Failed to copy');
      });
    }

    /* Main Render Dispatcher */
    function renderActiveView() {
      switch(state.activeTool) {
        case 'dashboard': renderDashboard(); break;
        case 'comparison': renderComparisonTool(); break;
        case 'direction': renderDirectionTool(); break;
        case 'energy': renderEnergyTool(); break;
        case 'decision': renderDecisionTool(); break;
        case 'weekly': renderWeeklyTool(); break;
        default: renderDashboard();
      }
    }

    /* ------------------------------------------------------------------
       DASHBOARD VIEW
    ------------------------------------------------------------------- */
    function renderDashboard() {
      mainContent.innerHTML = `
        <div class="card" style="background: linear-gradient(135deg, #3A0CA3 0%, #4361EE 100%); color: white;">
          <h1 style="font-size: 2rem; font-weight: 700; margin-bottom: 0.5rem;">The Stuck Adult</h1>
          <p style="font-size: 1.1rem; opacity: 0.9;">Find your next step when nothing feels clear.</p>
        </div>

        <div class="card">
          <label class="form-label" style="font-size: 1rem;"><i class="fa-regular fa-lightbulb" style="color: var(--secondary);"></i> Optional Reflection</label>
          <p style="font-size: 0.875rem; color: var(--text-muted); margin-bottom: 0.5rem;">When did you first feel stuck? (No need to submit—just pause and acknowledge it.)</p>
          <textarea class="form-control" placeholder="e.g., After I finished university, when turning 30, after changing jobs..."></textarea>
        </div>

        <h2 style="font-size: 1.25rem; font-weight: 700; color: var(--primary); margin-bottom: 1rem;">Self-Guided Toolkit</h2>
        
        <div class="dashboard-grid">
          <div class="dash-card" onclick="switchTool('comparison')">
            <div class="dash-card-icon"><i class="fa-solid fa-masks-theater"></i></div>
            <div class="dash-card-title">Comparison Detox</div>
            <div class="dash-card-desc">Separate assumed highlights from real facts and map your actual accomplishments.</div>
          </div>

          <div class="dash-card" onclick="switchTool('direction')">
            <div class="dash-card-icon"><i class="fa-solid fa-map-location-dot"></i></div>
            <div class="dash-card-title">Direction Finder</div>
            <div class="dash-card-desc">Identify core themes from past interests to build 30-day low-risk experiments.</div>
          </div>

          <div class="dash-card" onclick="switchTool('energy')">
            <div class="dash-card-icon"><i class="fa-solid fa-battery-half"></i></div>
            <div class="dash-card-title">Energy Audit</div>
            <div class="dash-card-desc">Locate your structural energy leaks and isolate baseline fatigue from burnout.</div>
          </div>

          <div class="dash-card" onclick="switchTool('decision')">
            <div class="dash-card-icon"><i class="fa-solid fa-scale-balanced"></i></div>
            <div class="dash-card-title">Decision Unsticker</div>
            <div class="dash-card-desc">Unpack decision paralysis, calculate the cost of waiting, and execute the 70% rule.</div>
          </div>

          <div class="dash-card" onclick="switchTool('weekly')">
            <div class="dash-card-icon"><i class="fa-solid fa-calendar-check"></i></div>
            <div class="dash-card-title">Weekly Reset</div>
            <div class="dash-card-desc">Audit your weekly momentum without judgment and commit to one tangible shift.</div>
          </div>

      const core = document.getElementById('decCore').value;
      const optA = document.getElementById('decOptA').value;
      const optB = document.getElementById('decOptB').value;
      const badA = document.getElementById('decBadA').value;
      const badB = document.getElementById('decBadB').value;
      const wait = document.getElementById('decWait').value;
      const who = document.getElementById('decWho').value;

      const outputHtml = `
        <div class="output-card" id="analysisResult">
          <div class="output-card-header">
            <div class="output-title"><i class="fa-solid fa-key"></i> Decision Unsticker Analysis</div>
            <button class="btn btn-outline btn-sm" onclick="copyToClipboard(document.getElementById('analysisResult').innerText)"><i class="fa-regular fa-copy"></i> Copy</button>
          </div>

          <div class="output-section">
            <div class="output-label">1. The Real Choice</div>
            <div class="output-content">
              This isn't just about <strong>${optA}</strong> vs. <strong>${optB}</strong>. It's a choice between two distinct types of discomfort: The active risk of failure vs. the passive risk of slow regret.
            </div>
          </div>

          <div class="output-section">
            <div class="output-label">2. Fear vs. Fact Analysis</div>
            <div class="output-content">
              <strong>If Option A goes wrong:</strong> <em>"${badA}"</em><br>
              <strong>If Option B goes wrong:</strong> <em>"${badB}"</em><br><br>
              Ask yourself: Which bad outcome is <em>reversible</em>? Most Option B failures involve temporary setbacks (money, pride), whereas Option A failures usually involve irreversible losses (time, self-trust).
            </div>
          </div>

          <div class="output-section">
            <div class="output-label">3. The Cost of Waiting</div>
            <div class="output-content">
              Doing nothing is not a neutral stance. Remaining undecided for 6 months costs: <em>"${wait}"</em>. You are paying a daily tax in mental energy while delaying the inevitable.
            </div>
          </div>

          <div class="output-section">
            <div class="output-label">4. Motivation Alignment</div>
            <div class="output-content">
              ${who === 'Me' ? "This decision is driven by your own authentic goals. Trust your internal signal." : `Warning: You identified that this decision is primarily driven by <strong>${who}</strong>. When you optimize for someone else's expectations or fear, even winning feels like losing.`}
            </div>
          </div>

          <div class="output-section">
            <div class="output-label">5. The 70% Rule</div>
            <div class="output-content">
              <strong>If you're 70% sure, decide. You will never reach 100% certainty before taking action.</strong> Remaining certainty is gathered through execution, not overthinking.
            </div>
          </div>

          <div class="output-section">
            <div class="output-label">6. One Micro-Step Today</div>
            <div class="output-content">
              Take one non-binding action today to test Option B without fully committing: send an email, run financial math on a spreadsheet, or consult one person who has taken that exact path.
            </div>
          </div>
        </div>
      `;

      document.getElementById('decisionOutput').innerHTML = outputHtml;

      saveHistoryItem('decision', {
        core,
        optA,
        optB,
        badA,
        badB,
        wait,
        who,
        date: new Date().toLocaleDateString()
      });
    }

    /* ------------------------------------------------------------------
       TOOL 5: WEEKLY RESET
    ------------------------------------------------------------------- */
    function renderWeeklyTool() {
      mainContent.innerHTML = `
        <div class="card">
          <div class="card-header">
            <div class="tool-title"><i class="fa-solid fa-calendar-check"></i> Weekly Reset</div>
            <div class="tool-problem">"Weeks go by and I have nothing to show for them."</div>
          </div>

          <form id="weeklyForm">
            <div class="form-group">
              <label class="form-label">What did you actually do this week?</label>
              <textarea class="form-control" id="wkDone" required placeholder="e.g., Answered emails, worked on project X, scrolled social media, cleaned apartment..."></textarea>
            </div>

            <div class="form-group">
              <label class="form-label">What felt like genuine progress?</label>
              <textarea class="form-control" id="wkProgress" required placeholder="e.g., Finished draft document, had good conversation with friend, went for 3 runs..."></textarea>
            </div>

            <div class="form-group">
              <label class="form-label">What felt like avoidance / empty time?</label>
              <textarea class="form-control" id="wkAvoidance" required placeholder="e.g., Late night YouTube rabbit holes, re-organizing notes instead of writing..."></textarea>
            </div>

            <div class="form-group">
              <label class="form-label">What do you want to be true next Friday?</label>
              <textarea class="form-control" id="wkTarget" required placeholder="e.g., Job application submitted, gym visited 3 times, difficult conversation finished..."></textarea>
            </div>

            <div class="form-group">
              <label class="form-label">One specific thing you are currently avoiding:</label>
              <textarea class="form-control" id="wkAvoidingThing" required placeholder="e.g., Opening the tax portal, replying to boss, booking dentist appointment..."></textarea>
            </div>

            <div class="button-group">
              <button type="submit" class="btn btn-primary"><i class="fa-solid fa-rotate"></i> Process Reset</button>
              <button type="button" class="btn btn-secondary" onclick="loadWeeklySample()"><i class="fa-solid fa-vial"></i> Load Sample Scenario</button>
            </div>
          </form>
        </div>

        <div id="weeklyOutput"></div>
        ${renderHistoryAccordion('weekly')}
      `;

      document.getElementById('weeklyForm').addEventListener('submit', (e) => {
        e.preventDefault();
        processWeekly();
      });
    }

    function loadWeeklySample() {
      document.getElementById('wkDone').value = "Put in 40 hours at work, watched 15 hours of TV/reels, cooked twice, handled laundry.";
      document.getElementById('wkProgress').value = "Maintained morning walks on Tuesday and Thursday.";
      document.getElementById('wkAvoidance').value = "Spending 2 hours every night scrolling short-form videos instead of sleeping.";
      document.getElementById('wkTarget').value = "Updated CV ready and one application submitted to a new company.";
      document.getElementById('wkAvoidingThing').value = "Updating the work experience section on my CV because it feels daunting.";
    }

    function processWeekly() {
      const done = document.getElementById('wkDone').value;
      const progress = document.getElementById('wkProgress').value;
      const avoidance = document.getElementById('wkAvoidance').value;
      const target = document.getElementById('wkTarget').value;
      const avoidingThing = document.getElementById('wkAvoidingThing').value;

      const outputHtml = `
        <div class="output-card" id="analysisResult">
          <div class="output-card-header">
            <div class="output-title"><i class="fa-solid fa-arrows-rotate"></i> Weekly Reset Assessment</div>
            <button class="btn btn-outline btn-sm" onclick="copyToClipboard(document.getElementById('analysisResult').innerText)"><i class="fa-regular fa-copy"></i> Copy</button>
          </div>

          <div class="output-section">
            <div class="output-label">1. Weekly Reality Check</div>
            <div class="output-content">
              Without shame or self-congratulation, here is the objective log of your week:<br>
              <strong>Inputs:</strong> <em>"${done}"</em><br>
              <strong>Friction Points:</strong> <em>"${avoidance}"</em>
            </div>
          </div>

          <div class="output-section">
            <div class="output-label">2. Progress Audit</div>
            <div class="output-content">
              You had real movement in these areas: <em>"${progress}"</em>.<br>
              Acknowledge this proof of agency: even in slow weeks, you are capable of execution.
            </div>
          </div>

          <div class="output-section">
            <div class="output-label">3. The Avoidance Cost</div>
            <div class="output-content">
              You are currently putting off: <strong>"${avoidingThing}"</strong>.<br>
              The task itself usually takes less than 30 minutes, but avoiding it causes multi-day background strain. Unaddressed tasks compound mental baggage.
            </div>
          </div>

          <div class="output-section">
            <div class="output-label">4. Next Week's ONE Commitment</div>
            <div class="output-content">
              Do not try to overhaul your whole life next week. Focus on ONE clear outcome by next Friday:<br>
              <strong style="font-size: 1.05rem; color: var(--primary);">"${target}"</strong>
            </div>
          </div>

          <div class="output-section">
            <div class="output-label">5. Accountability Hack</div>
            <div class="output-content">
              To guarantee completion of your single target, modify your environment: Schedule a 25-minute focus timer on Monday morning, or tell a trusted peer you will send them proof of completion by Wednesday.
            </div>
          </div>
        </div>
      `;

      document.getElementById('weeklyOutput').innerHTML = outputHtml;

      saveHistoryItem('weekly', {
        done,
        progress,
        avoidance,
        target,
        avoidingThing,
        date: new Date().toLocaleDateString()
      });
    }

    /* ------------------------------------------------------------------
       HISTORY ACCORDION COMPONENT
    ------------------------------------------------------------------- */
    function renderHistoryAccordion(toolId) {
      const history = getHistory(toolId);
      if (!history.length) return '';

      const itemsHtml = history.map(item => {
        let snippet = '';
        if (toolId === 'comparison') snippet = `Compared to: ${item.data.target}`;
        else if (toolId === 'direction') snippet = `Fear: ${item.data.fear}`;
        else if (toolId === 'energy') snippet = `Drain: ${item.data.drain}`;
        else if (toolId === 'decision') snippet = `Decision: ${item.data.core}`;
        else if (toolId === 'weekly') snippet = `Target: ${item.data.target}`;

        return `
          <div class="history-item">
            <div class="history-item-date"><i class="fa-regular fa-clock"></i> ${item.date}</div>
            <div><strong>${snippet}</strong></div>
          </div>
        `;
      }).join('');

      return `
        <div class="history-section">
          <div class="history-header" onclick="toggleHistory('${toolId}')">
            <span class="history-title"><i class="fa-solid fa-box-archive"></i> Saved History (${history.length}/30)</span>
            <i class="fa-solid fa-chevron-down" id="histIcon_${toolId}"></i>
          </div>
          <div class="history-list" id="histList_${toolId}">
            ${itemsHtml}
            <div style="margin-top: 0.5rem;">
              <button class="btn btn-outline btn-sm" onclick="clearToolHistory('${toolId}')"><i class="fa-solid fa-trash"></i> Clear History</button>
            </div>
          </div>
        </div>
      `;
    }

    function toggleHistory(toolId) {
      const list = document.getElementById(`histList_${toolId}`);
      const icon = document.getElementById(`histIcon_${toolId}`);
      if (list) {
        list.classList.toggle('open');
        if (icon) {
          icon.classList.toggle('fa-chevron-up');
          icon.classList.toggle('fa-chevron-down');
        }
      }
    }
  </script>
</body>
</html>
