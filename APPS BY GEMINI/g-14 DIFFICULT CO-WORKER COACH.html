<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DifficultCoworkerCoach</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* ==========================================================================
       1. VARS & RESET
       ========================================================================== */
    :root {
      --moss-green: #606C38;
      --moss-green-dark: #475129;
      --dusty-rose: #BC6C25;
      --dusty-rose-dark: #97531a;
      --bg-gradient-start: #FEFAE0;
      --bg-gradient-end: #FAEDCD;
      --text-main: #2B2D42;
      --text-muted: #6C757D;
      --card-bg: #FFFFFF;
      --border-color: #E9ECEF;
      --sidebar-width: 260px;
      --radius-xl: 1rem;
      --shadow-sm: 0 4px 12px rgba(0,0,0,0.05);
      --shadow-md: 0 8px 24px rgba(0,0,0,0.08);
      --transition-fast: 0.2s ease;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: var(--text-main);
      background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
    }

    /* ==========================================================================
       2. LAYOUT & SIDEBAR
       ========================================================================== */
    #app {
      display: flex;
      flex: 1;
      position: relative;
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 40;
      backdrop-filter: blur(2px);
    }

    .sidebar {
      width: var(--sidebar-width);
      background-color: #FFFFFF;
      border-right: 1px solid rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 50;
      box-shadow: var(--shadow-sm);
      transition: transform 0.3s ease;
    }

    .sidebar-header {
      padding: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      border-bottom: 1px solid var(--border-color);
    }

    .sidebar-header i {
      font-size: 1.5rem;
      color: var(--moss-green);
    }

    .sidebar-header h1 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--moss-green);
      line-height: 1.2;
    }

    .sidebar-nav {
      padding: 1rem 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      flex: 1;
      overflow-y: auto;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      border: none;
      background: transparent;
      color: var(--text-main);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: all var(--transition-fast);
      width: 100%;
    }

    .nav-btn i {
      font-size: 1.1rem;
      width: 1.25rem;
      text-align: center;
      color: var(--text-muted);
    }

    .nav-btn:hover {
      background-color: rgba(96, 108, 56, 0.08);
      color: var(--moss-green);
    }

    .nav-btn:hover i {
      color: var(--moss-green);
    }

    .nav-btn.active {
      background-color: var(--moss-green);
      color: #FFFFFF;
    }

    .nav-btn.active i {
      color: #FFFFFF;
    }

    .main-wrapper {
      flex: 1;
      margin-left: var(--sidebar-width);
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    /* Mobile Header */
    .mobile-header {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 1rem;
      background: #FFFFFF;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 30;
    }

    .mobile-brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 700;
      color: var(--moss-green);
    }

    .hamburger-btn {
      background: none;
      border: none;
      font-size: 1.25rem;
      color: var(--text-main);
      cursor: pointer;
      padding: 0.25rem;
    }

    .main-content {
      flex: 1;
      padding: 2rem 1.5rem;
      max-width: 850px;
      width: 100%;
      margin: 0 auto;
    }

    /* ==========================================================================
       3. FOOTER
       ========================================================================== */
    .app-footer {
      text-align: center;
      padding: 1.5rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      border-top: 1px solid rgba(0,0,0,0.05);
      background: rgba(255, 255, 255, 0.4);
      margin-top: auto;
    }

    /* ==========================================================================
       4. CARDS & UI COMPONENTS
       ========================================================================== */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-sm);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      border: 1px solid rgba(0,0,0,0.03);
    }

    .hero-card {
      text-align: center;
      padding: 2.5rem 1.5rem;
      background: #FFFFFF;
      border-top: 4px solid var(--moss-green);
    }

    .hero-card h2 {
      font-size: 1.8rem;
      color: var(--moss-green);
      margin-bottom: 0.5rem;
      font-weight: 700;
    }

    .hero-card p {
      color: var(--dusty-rose);
      font-size: 1.1rem;
      font-weight: 500;
    }

    .dash-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.25rem;
    }

    .dash-card {
      cursor: pointer;
      transition: transform var(--transition-fast), box-shadow var(--transition-fast);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      height: 100%;
    }

    .dash-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
      border-color: var(--moss-green);
    }

    .dash-icon {
      width: 48px;
      height: 48px;
      border-radius: 0.75rem;
      background: rgba(96, 108, 56, 0.1);
      color: var(--moss-green);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
      margin-bottom: 1rem;
    }

    .dash-card h3 {
      font-size: 1.1rem;
      margin-bottom: 0.35rem;
      color: var(--text-main);
    }

    .dash-card p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Tool Headers & Forms */
    .tool-header {
      margin-bottom: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .tool-title h2 {
      font-size: 1.5rem;
      color: var(--moss-green);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .tool-title p {
      color: var(--dusty-rose);
      font-style: italic;
      font-size: 0.95rem;
      margin-top: 0.2rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 0.4rem;
      color: var(--text-main);
    }

    .form-control {
      width: 100%;
      padding: 0.75rem 0.9rem;
      border: 1px solid var(--border-color);
      border-radius: 0.5rem;
      font-family: inherit;
      font-size: 0.9rem;
      color: var(--text-main);
      background-color: #FAFAFA;
      transition: border-color var(--transition-fast), background-color var(--transition-fast);
    }

    .form-control:focus {
      outline: none;
      border-color: var(--moss-green);
      background-color: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(96, 108, 56, 0.15);
    }

    textarea.form-control {
      min-height: 80px;
      resize: vertical;
    }

    .radio-group {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 0.25rem;
    }

    .radio-label {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.9rem;
      cursor: pointer;
      font-weight: normal;
    }

    .radio-label input[type="radio"] {
      accent-color: var(--moss-green);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 1.25rem;
      border-radius: 0.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all var(--transition-fast);
    }

    .btn-primary {
      background-color: var(--moss-green);
      color: #FFFFFF;
    }

    .btn-primary:hover {
      background-color: var(--moss-green-dark);
    }

    .btn-secondary {
      background-color: rgba(188, 108, 37, 0.1);
      color: var(--dusty-rose-dark);
    }

    .btn-secondary:hover {
      background-color: rgba(188, 108, 37, 0.2);
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
    }

    .btn-outline:hover {
      background: #F8F9FA;
    }

    .btn-sm {
      padding: 0.4rem 0.75rem;
      font-size: 0.8rem;
    }

    .btn-block {
      width: 100%;
    }

    .action-row {
      display: flex;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }

    /* Output Displays */
    .output-card {
      background: #FFFFFF;
      border-left: 4px solid var(--dusty-rose);
      display: none;
    }

    .output-card.active {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    .output-section {
      margin-bottom: 1.25rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--border-color);
    }

    .output-section:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
    }

    .output-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.4rem;
    }

    .output-title {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--dusty-rose-dark);
    }

    .output-body {
      font-size: 0.95rem;
      color: var(--text-main);
      background: #FDFBF7;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      border: 1px solid rgba(188, 108, 37, 0.15);
      white-space: pre-line;
    }

    .badge {
      display: inline-block;
      padding: 0.25rem 0.6rem;
      border-radius: 1rem;
      font-size: 0.75rem;
      font-weight: 700;
      background: var(--moss-green);
      color: #FFFFFF;
      margin-bottom: 0.5rem;
    }

    /* History Accordion */
    .history-card {
      margin-top: 2rem;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }

    .history-title {
      font-size: 1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-muted);
    }

    .history-body {
      margin-top: 1rem;
      display: none;
    }

    .history-body.active {
      display: block;
    }

    .history-item {
      padding: 0.75rem;
      border: 1px solid var(--border-color);
      border-radius: 0.5rem;
      margin-bottom: 0.5rem;
      background: #FAFAFA;
      cursor: pointer;
      transition: background-color var(--transition-fast);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .history-item:hover {
      background: #F1F3F5;
    }

    .history-item-info {
      font-size: 0.85rem;
    }

    .history-item-date {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: var(--text-main);
      color: #FFFFFF;
      padding: 0.75rem 1.25rem;
      border-radius: 0.5rem;
      font-size: 0.85rem;
      font-weight: 500;
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.2s ease;
      pointer-events: none;
      z-index: 100;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ==========================================================================
       5. RESPONSIVE STYLES
       ========================================================================== */
    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .sidebar-overlay.open {
        display: block;
      }

      .main-wrapper {
        margin-left: 0;
      }

      .mobile-header {
        display: flex;
      }

      .main-content {
        padding: 1.25rem 1rem;
      }

      .action-row {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div id="app">
    <!-- Sidebar Overlay for Mobile -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <i class="fa-solid fa-hands-holding-circle"></i>
        <h1>Difficult Coworker<br>Coach</h1>
      </div>
      <nav class="sidebar-nav">
        <button class="nav-btn active" data-tool="dashboard">
          <i class="fa-solid fa-house"></i> Dashboard
        </button>
        <button class="nav-btn" data-tool="tool1">
          <i class="fa-solid fa-magnifying-glass-chart"></i> Conflict Decoder
        </button>
        <button class="nav-btn" data-tool="tool2">
          <i class="fa-solid fa-comments"></i> Script Builder
        </button>
        <button class="nav-btn" data-tool="tool3">
          <i class="fa-solid fa-shield-halved"></i> Boundary Setter
        </button>
        <button class="nav-btn" data-tool="tool4">
          <i class="fa-solid fa-clipboard-list"></i> Documentation Log
        </button>
        <button class="nav-btn" data-tool="tool5">
          <i class="fa-solid fa-compass"></i> Coexistence Plan
        </button>
      </nav>
    </aside>

    <!-- Main Content Wrapper -->
    <div class="main-wrapper">
      <!-- Mobile Header -->
      <header class="mobile-header">
        <div class="mobile-brand">
          <i class="fa-solid fa-hands-holding-circle"></i>
          <span>Coworker Coach</span>
        </div>
        <button class="hamburger-btn" id="hamburgerBtn" aria-label="Toggle navigation">
          <i class="fa-solid fa-bars"></i>
        </button>
      </header>

      <!-- Dynamic Screen Content -->
      <main class="main-content" id="mainContent">
        <!-- Content will be injected by JavaScript -->
      </main>

      <!-- Sticky Disclaimer Footer -->
      <footer class="app-footer">
        For workplace communication strategy only. Not mediation, legal, or therapeutic advice. For harassment or discrimination, contact HR or appropriate authorities.
      </footer>
    </div>
  </div>

  <!-- Global Toast Notification -->
  <div class="toast" id="toast">
    <i class="fa-solid fa-circle-check"></i>
    <span id="toastMsg">Copied!</span>
  </div>

  <!-- ==========================================================================
     6. JAVASCRIPT LOGIC
     ========================================================================== -->
  <script>
    // Global Application State
    const state = {
      activeTool: 'dashboard'
    };

    // DOM Elements
    const mainContent = document.getElementById('mainContent');
    const sidebar = document.getElementById('sidebar');
    const sidebarOverlay = document.getElementById('sidebarOverlay');
    const hamburgerBtn = document.getElementById('hamburgerBtn');
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toastMsg');

    // Setup Event Listeners
    document.addEventListener('DOMContentLoaded', () => {
      initNavigation();
      renderScreen(state.activeTool);
    });

    function initNavigation() {
      // Sidebar Navigation Click Handlers
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const toolId = e.currentTarget.getAttribute('data-tool');
          switchTool(toolId);
          closeMobileSidebar();
        });
      });

      // Mobile Menu Handlers
      hamburgerBtn.addEventListener('click', toggleMobileSidebar);
      sidebarOverlay.addEventListener('click', closeMobileSidebar);
    }

    function switchTool(toolId) {
      state.activeTool = toolId;
      document.querySelectorAll('.nav-btn').forEach(btn => {
        if (btn.getAttribute('data-tool') === toolId) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
      renderScreen(toolId);
      window.scrollTo(0, 0);
    }

    function toggleMobileSidebar() {
      sidebar.classList.toggle('open');
      sidebarOverlay.classList.toggle('open');
    }

    function closeMobileSidebar() {
      sidebar.classList.remove('open');
      sidebarOverlay.classList.remove('open');
    }

    function showToast(message) {
      toastMsg.innerText = message;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }

    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        showToast('Copied to clipboard!');
      }).catch(() => {
        showToast('Failed to copy');
      });
    }

    // Local Storage Helpers
    function getHistory(toolId) {
      const data = localStorage.getItem(`coworker_history_${toolId}`);
      return data ? JSON.parse(data) : [];
    }

    function saveHistoryItem(toolId, item) {
      let list = getHistory(toolId);
      list.unshift({ id: Date.now(), timestamp: new Date().toLocaleString(), data: item });
      if (list.length > 30) list = list.slice(0, 30); // Max 30 items
      localStorage.setItem(`coworker_history_${toolId}`, JSON.stringify(list));
    }

    function clearToolHistory(toolId) {
      localStorage.removeItem(`coworker_history_${toolId}`);
      renderScreen(toolId);
      showToast('History cleared');
    }

    // Helper for rendering history accordion
    function renderHistoryAccordionHTML(toolId) {
      const history = getHistory(toolId);
      if (history.length === 0) return '';

      return `
        <div class="card history-card">
          <div class="history-header" onclick="toggleHistoryBody('${toolId}')">
            <span class="history-title"><i class="fa-solid fa-clock-rotate-left"></i> Previous Analyses (${history.length})</span>
            <i class="fa-solid fa-chevron-down" id="history-chevron-${toolId}"></i>
          </div>
          <div class="history-body" id="history-body-${toolId}">
            <div style="text-align: right; margin-bottom: 0.5rem;">
              <button class="btn btn-outline btn-sm" onclick="clearToolHistory('${toolId}')">Clear History</button>
            </div>
            ${history.map((h, index) => `
              <div class="history-item" onclick="loadHistoryItem('${toolId}', ${index})">
                <div class="history-item-info">
                  <strong>${h.data.summaryLabel || 'Saved Result'}</strong>
                  <div class="history-item-date">${h.timestamp}</div>
                </div>
                <i class="fa-solid fa-angle-right" style="color: var(--text-muted)"></i>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function toggleHistoryBody(toolId) {
      const body = document.getElementById(`history-body-${toolId}`);
      const chevron = document.getElementById(`history-chevron-${toolId}`);
      if (body.classList.contains('active')) {
        body.classList.remove('active');
        chevron.className = 'fa-solid fa-chevron-down';
      } else {
        body.classList.add('active');
        chevron.className = 'fa-solid fa-chevron-up';
      }
    }

    // ==========================================================================
    // 7. SCREEN RENDERERS
    // ==========================================================================

    function renderScreen(screenId) {
      switch (screenId) {
        case 'dashboard': renderDashboard(); break;
        case 'tool1': renderTool1(); break;
        case 'tool2': renderTool2(); break;
        case 'tool3': renderTool3(); break;
        case 'tool4': renderTool4(); break;
        case 'tool5': renderTool5(); break;
        default: renderDashboard();
      }
    }

    /* --- DASHBOARD --- */
    function renderDashboard() {
      mainContent.innerHTML = `
        <div class="card hero-card">
          <h2>Difficult Coworker Coach</h2>
          <p>Turn tension into traction—or know when to stop trying.</p>
        </div>

        <div class="dash-grid">
          <div class="card dash-card" onclick="switchTool('tool1')">
            <div class="dash-icon"><i class="fa-solid fa-magnifying-glass-chart"></i></div>
            <h3>Conflict Decoder</h3>
            <p>Every interaction turns into conflict? Diagnose why and uncover hidden friction.</p>
          </div>

          <div class="card dash-card" onclick="switchTool('tool2')">
            <div class="dash-icon"><i class="fa-solid fa-comments"></i></div>
            <h3>Conversation Script Builder</h3>
            <p>Need to speak up but unsure what to say? Generate professional opening and response lines.</p>
          </div>

          <div class="card dash-card" onclick="switchTool('tool3')">
            <div class="dash-icon"><i class="fa-solid fa-shield-halved"></i></div>
            <h3>Boundary Setter</h3>
            <p>Lines keep being crossed? Draft clear, professional boundaries and consequences.</p>
          </div>

          <div class="card dash-card" onclick="switchTool('tool4')">
            <div class="dash-icon"><i class="fa-solid fa-clipboard-list"></i></div>
            <h3>Documentation Log</h3>
            <p>Need an objective record? Build an HR-ready timeline and clear evidence log.</p>
          </div>

          <div class="card dash-card" onclick="switchTool('tool5')">
            <div class="dash-icon"><i class="fa-solid fa-compass"></i></div>
            <h3>Coexistence Plan</h3>
            <p>Relationship won't improve? Build a realistic strategy to protect your career and sanity.</p>
          </div>
        </div>
      `;
    }

    /* --- TOOL 1: CONFLICT DECODER --- */
    function renderTool1() {
      mainContent.innerHTML = `
        <div class="tool-header">
          <div class="tool-title">
            <h2><i class="fa-solid fa-magnifying-glass-chart"></i> Conflict Decoder</h2>
            <p>"Every interaction with this person turns into conflict. Why?"</p>

          <button class="btn btn-secondary btn-sm" onclick="loadSampleTool5()">
            <i class="fa-solid fa-wand-magic-sparkles"></i> Load Sample Scenario
          </button>
        </div>

        <div class="card">
          <form id="formTool5" onsubmit="processTool5(event)">
            <div class="form-group">
              <label>Have you tried to resolve this?</label>
              <div class="radio-group">
                <label class="radio-label"><input type="radio" name="t5_tried" value="Multiple times" checked> Multiple times</label>
                <label class="radio-label"><input type="radio" name="t5_tried" value="Once"> Once</label>
                <label class="radio-label"><input type="radio" name="t5_tried" value="Never"> Never</label>
                <label class="radio-label"><input type="radio" name="t5_tried" value="They refuse"> They refuse to talk</label>
              </div>
            </div>

            <div class="form-group">
              <label>Do you depend on them to do your job?</label>
              <div class="radio-group">
                <label class="radio-label"><input type="radio" name="t5_depend" value="Heavily" checked> Heavily</label>
                <label class="radio-label"><input type="radio" name="t5_depend" value="Somewhat"> Somewhat</label>
                <label class="radio-label"><input type="radio" name="t5_depend" value="Not really"> Not really</label>
              </div>
            </div>

            <div class="form-group">
              <label for="t5_timeline">How much longer do you work together?</label>
              <select id="t5_timeline" class="form-control" required>
                <option value="Indefinitely">Indefinitely</option>
                <option value="Project ends soon">Project ends soon</option>
                <option value="One of us is leaving">One of us is leaving</option>
                <option value="Don't know">Don't know</option>
              </select>
            </div>

            <div class="form-group">
              <label>What's your priority?</label>
              <div class="radio-group">
                <label class="radio-label"><input type="radio" name="t5_priority" value="Protect my reputation"> Protect my reputation</label>
                <label class="radio-label"><input type="radio" name="t5_priority" value="Minimize interaction" checked> Minimize interaction</label>
                <label class="radio-label"><input type="radio" name="t5_priority" value="Just get the work done"> Just get work done</label>
                <label class="radio-label"><input type="radio" name="t5_priority" value="Find an exit"> Find an exit</label>
              </div>
            </div>

            <div class="action-row">
              <button type="submit" class="btn btn-primary btn-block">Build Survival Strategy</button>
            </div>
          </form>
        </div>

        <div id="outputTool5" class="card output-card"></div>
        ${renderHistoryAccordionHTML('tool5')}
      `;
    }

    function loadSampleTool5() {
      document.querySelector('input[name="t5_tried"][value="Multiple times"]').checked = true;
      document.querySelector('input[name="t5_depend"][value="Heavily"]').checked = true;
      document.getElementById('t5_timeline').value = "Indefinitely";
      document.querySelector('input[name="t5_priority"][value="Minimize interaction"]').checked = true;
      showToast('Sample scenario loaded');
    }

    function processTool5(e, savedData = null) {
      if (e) e.preventDefault();

      let data = savedData;
      if (!data) {
        const tried = document.querySelector('input[name="t5_tried"]:checked').value;
        const depend = document.querySelector('input[name="t5_depend"]:checked').value;
        const timeline = document.getElementById('t5_timeline').value;
        const priority = document.querySelector('input[name="t5_priority"]:checked').value;

        // Strategy Determination Logic
        let mode = "Transactional Only";
        if (priority === "Find an exit") mode = "Parallel Tracks & Active Exit Plan";
        else if (depend === "Not really") mode = "Minimal Contact";
        else if (tried === "Multiple times" && depend === "Heavily") mode = "Transactional Formalism & Escalate";

        let rules = `1. All operational requests must be made in writing (email or project management tool).\n2. Keep face-to-face interactions restricted to group meetings with third parties present.\n3. Respond to inquiries strictly with facts, zero emotional commentary, and standard professional courtesy.`;

        let shield = `Recognize that their behavior is a reflection of their limitations, not your worth. Treat interactions like business transactions—detach your emotional self and act as a neutral representative of your role.`;

        let allyMap = `Identify peer leads, project managers, or cross-functional team members who can validate deliverables, assist in handoffs, or act as objective buffers.`;

        let exit = timeline === "Indefinitely" || priority === "Find an exit"
          ? `If workplace stress persists for over 60 days without management intervention, begin updating your portfolio and exploring internal transfers or external opportunities.`
          : `Maintain this strategy until project completion. No long-term exit action required unless timeline expands.`;

        data = {
          tried, depend, timeline, priority,
          mode, rules, shield, allyMap, exit,
          summaryLabel: `Strategy: ${mode}`
        };

        saveHistoryItem('tool5', data);
      }

      const container = document.getElementById('outputTool5');
      container.innerHTML = `
        <span class="badge">Coexistence Blueprint</span>
        
        <div class="output-section">
          <div class="output-title">Recommended Strategy Mode</div>
          <div class="output-body"><strong>${data.mode}</strong></div>
        </div>

        <div class="output-section">
          <div class="output-title">Core Interaction Rules</div>
          <div class="output-body">${data.rules}</div>
        </div>

        <div class="output-section">
          <div class="output-title">Emotional Shielding Technique</div>
          <div class="output-body">${data.shield}</div>
        </div>

        <div class="output-section">
          <div class="output-title">Ally Mapping Strategy</div>
          <div class="output-body">${data.allyMap}</div>
        </div>

        <div class="output-section">
          <div class="output-title">Exit & Timeline Guidance</div>
          <div class="output-body">${data.exit}</div>
        </div>
      `;
      container.classList.add('active');
      container.scrollIntoView({ behavior: 'smooth' });
    }

    // Helper for loading saved items from accordion
    function loadHistoryItem(toolId, index) {
      const history = getHistory(toolId);
      const item = history[index];
      if (!item) return;

      if (toolId === 'tool1') processTool1(null, item.data);
      else if (toolId === 'tool2') processTool2(null, item.data);
      else if (toolId === 'tool3') processTool3(null, item.data);
      else if (toolId === 'tool4') processTool4(null, item.data);
      else if (toolId === 'tool5') processTool5(null, item.data);
    }

    function escapeForOnClick(str) {
      return str.replace(/`/g, '\\`').replace(/\${/g, '\\${').replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
