<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewlywedNavigator - Practical Marriage Toolkit</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --coral: #E07A5F;
            --sage: #81B29A;
            --dark: #2D3748;
            --light-bg-1: #FEFAE0;
            --light-bg-2: #F2E9E4;
            --white: #FFFFFF;
            --gray-100: #F7FAFC;
            --gray-200: #EDF2F7;
            --gray-300: #E2E8F0;
            --gray-600: #718096;
            --gray-700: #4A5568;
            --red: #E53E3E;
            --yellow: #D69E2E;
            --green: #38A169;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--light-bg-1) 0%, var(--light-bg-2) 100%);
            color: var(--dark);
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
        }

        /* Layout */
        .app-layout {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 240px;
            background: var(--white);
            box-shadow: 2px 0 10px rgba(0,0,0,0.05);
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }

        .sidebar-brand {
            padding: 24px 20px;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--coral);
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--gray-200);
        }

        .sidebar-menu {
            list-style: none;
            padding: 20px 0;
            flex-grow: 1;
            overflow-y: auto;
        }

        .sidebar-menu li {
            margin-bottom: 4px;
        }

        .sidebar-menu a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            color: var(--gray-700);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .sidebar-menu a:hover, .sidebar-menu a.active {
            background-color: rgba(224, 122, 95, 0.1);
            color: var(--coral);
            border-right: 4px solid var(--coral);
        }

        .sidebar-menu a i {
            width: 20px;
            text-align: center;
        }

        /* Mobile Header & Overlay */
        .mobile-header {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--white);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            z-index: 90;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        .hamburger {
            background: none;
            border: none;
            font-size: 1.25rem;
            color: var(--dark);
            cursor: pointer;
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.4);
            z-index: 95;
        }

        /* Main Content */
        .main-content {
            flex-grow: 1;
            margin-left: 240px;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .content-container {
            width: 100%;
            max-width: 800px;
            flex-grow: 1;
        }

        /* Cards */
        .card {
            background: var(--white);
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        /* Typography & Headings */
        h1 {
            font-size: 2rem;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 0.5rem;
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 1rem;
        }

        h3 {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 0.75rem;
        }

        p {
            color: var(--gray-600);
            line-height: 1.6;
            margin-bottom: 1rem;
        }

        .tagline {
            font-size: 1.1rem;
            color: var(--gray-600);
            margin-bottom: 2rem;
        }

        /* Buttons & Actions */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: var(--coral);
            color: var(--white);
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 0.5rem;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            font-size: 0.95rem;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background-color: var(--sage);
        }

        .btn-outline {
            background-color: transparent;
            border: 1px solid var(--gray-300);
            color: var(--gray-700);
        }

        .btn-outline:hover {
            background-color: var(--gray-100);
        }

        .action-row {
            display: flex;
            gap: 12px;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--gray-700);
            margin-bottom: 0.5rem;
        }

        input[type="text"], input[type="number"], select, textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--gray-300);
            border-radius: 0.5rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            color: var(--dark);
            background-color: var(--white);
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, input[type="number"]:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--coral);
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        .radio-group, .checkbox-group {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-top: 0.5rem;
        }

        .radio-label, .checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 400;
            color: var(--gray-700);
            cursor: pointer;
        }

        /* Dashboard Grid */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .dashboard-card {
            background: var(--white);
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border-top: 4px solid var(--coral);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .dashboard-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08);
        }

        .dashboard-card i {
            font-size: 2rem;
            color: var(--coral);
            margin-bottom: 1rem;
        }

        .dashboard-card h3 {
            margin-bottom: 0.5rem;
        }

        .dashboard-card p {
            font-size: 0.9rem;
            margin-bottom: 0;
        }

        /* Results / Output Sections */
        .output-section {
            background: var(--gray-100);
            border-left: 4px solid var(--sage);
            padding: 1.25rem;
            border-radius: 0 0.5rem 0.5rem 0;
            margin-top: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .output-section h4 {
            color: var(--dark);
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Tables & Lists */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            margin-bottom: 1rem;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--gray-200);
            font-size: 0.95rem;
        }

        th {
            font-weight: 600;
            color: var(--gray-700);
            background-color: var(--gray-100);
        }

        /* Progress Bar */
        .progress-bar-container {
            background: var(--gray-200);
            border-radius: 9999px;
            height: 24px;
            width: 100%;
            overflow: hidden;
            display: flex;
            margin: 1rem 0;
        }

        .progress-segment {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.8rem;
            font-weight: 600;
            transition: width 0.4s ease;
        }

        /* Badges */
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-green { background: #C6F6D5; color: #22543D; }
        .badge-yellow { background: #FEFCBF; color: #744210; }
        .badge-red { background: #FED7D7; color: #742A2A; }

        /* History Accordion */
        .history-container {
            margin-top: 2rem;
            border-top: 1px solid var(--gray-300);
            padding-top: 1.5rem;
        }

        .history-item {
            background: var(--white);
            border: 1px solid var(--gray-200);
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 0.75rem;
            font-size: 0.9rem;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            color: var(--gray-700);
            margin-bottom: 0.5rem;
        }

        /* Footer */
        .app-footer {
            text-align: center;
            font-size: 0.85rem;
            color: var(--gray-600);
            padding: 2rem 0 1rem 0;
            margin-top: auto;
            border-top: 1px solid var(--gray-200);
            width: 100%;
        }

        /* Toast Notification */
        #toast-notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--dark);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
            font-size: 0.9rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* Responsive Breakpoints */
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .mobile-header {
                display: flex;
            }
            .main-content {
                margin-left: 0;
                padding: 80px 16px 20px 16px;
            }
        }
    </style>
</head>
<body>

    <div class="app-layout">
        <!-- Mobile Header -->
        <header class="mobile-header">
            <button class="hamburger" id="hamburger-btn" onclick="toggleSidebar()">
                <i class="fa-solid fa-bars"></i>
            </button>
            <span style="font-weight: 700; color: var(--coral);">NewlywedNavigator</span>
            <div style="width: 24px;"></div>
        </header>

        <!-- Sidebar Overlay -->
        <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <i class="fa-solid fa-compass"></i>
                <span>Newlywed Nav</span>
            </div>
            <ul class="sidebar-menu">
                <li><a href="#" onclick="navigate('dashboard')" id="nav-dashboard" class="active"><i class="fa-solid fa-house"></i> Dashboard</a></li>
                <li><a href="#" onclick="navigate('tool-money')" id="nav-tool-money"><i class="fa-solid fa-wallet"></i> Money Match</a></li>
                <li><a href="#" onclick="navigate('tool-chores')" id="nav-tool-chores"><i class="fa-solid fa-broom"></i> Chore Map</a></li>
                <li><a href="#" onclick="navigate('tool-expectations')" id="nav-tool-expectations"><i class="fa-solid fa-puzzle-piece"></i> Expectation Check</a></li>
                <li><a href="#" onclick="navigate('tool-inlaw')" id="nav-tool-inlaw"><i class="fa-solid fa-people-roof"></i> In-Law Boundary</a></li>
                <li><a href="#" onclick="navigate('tool-pulse')" id="nav-tool-pulse"><i class="fa-solid fa-heart-pulse"></i> Weekly Pulse</a></li>
            </ul>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <div class="content-container" id="main-view">
                <!-- Dynamic Content Renders Here -->
            </div>
            <footer class="app-footer">
                For entertainment and reflection purposes only. Not therapy or professional advice.
            </footer>
        </main>
    </div>

    <!-- Toast Notification -->
    <div id="toast-notification">Copied!</div>

    <script>
        // --- State and Navigation ---
        let currentView = 'dashboard';

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.toggle('open');
            overlay.style.display = sidebar.classList.contains('open') ? 'block' : 'none';
        }

        function navigate(viewId) {
            currentView = viewId;
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (sidebar.classList.contains('open')) {
                sidebar.classList.remove('open');
                overlay.style.display = 'none';
            }

            // Update active state in menu
            document.querySelectorAll('.sidebar-menu a').forEach(a => a.classList.remove('active'));
            const activeNav = document.getElementById('nav-' + viewId.replace('tool-', 'tool-'));
            if (activeNav) activeNav.classList.add('active');
            if (viewId === 'dashboard') {
                document.getElementById('nav-dashboard').classList.add('active');
            }

            renderView();
            window.scrollTo(0, 0);
        }

        function showToast(message = "Copied!") {
            const toast = document.getElementById('toast-notification');
            toast.textContent = message;
            toast.style.opacity = '1';
            setTimeout(() => {
                toast.style.opacity = '0';
            }, 2000);
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showToast("Copied to clipboard!");
            });
        }

        // --- LocalStorage Helpers ---
        function saveHistory(toolId, data) {
            const key = `newlywed_history_${toolId}`;
            let history = JSON.parse(localStorage.getItem(key)) || [];
            history.unshift({ date: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}), data });
            if (history.length > 30) history = history.slice(0, 30);
            localStorage.setItem(key, JSON.stringify(history));
        }

        function getHistory(toolId) {
            const key = `newlywed_history_${toolId}`;
            return JSON.parse(localStorage.getItem(key)) || [];
        }

        function clearHistory(toolId) {
            localStorage.removeItem(`newlywed_history_${toolId}`);
            renderView();
        }

        // --- Render Views ---
        function renderView() {
            const container = document.getElementById('main-view');
            switch(currentView) {
                case 'dashboard':
                    container.innerHTML = renderDashboard();
                    break;
                case 'tool-money':
                    container.innerHTML = renderMoneyMatch();
                    break;
                case 'tool-chores':
                    container.innerHTML = renderChoreMap();
                    break;
                case 'tool-expectations':
                    container.innerHTML = renderExpectationCheck();
                    break;
                case 'tool-inlaw':
                    container.innerHTML = renderInLawBoundary();
                    break;
                case 'tool-pulse':
                    container.innerHTML = renderWeeklyPulse();
                    break;
                default:
                    container.innerHTML = renderDashboard();
            }
        }

        // --- Dashboard ---
        function renderDashboard() {
            return `
                <div class="card" style="border-top: 6px solid var(--coral); padding: 2.5rem 2rem;">
                    <h1>Newlywed Navigator</h1>
                    <p class="tagline">Build a better marriage before small problems become big ones.</p>
                    <p>Welcome to your practical toolkit designed specifically for couples in their first 0–3 years of marriage. Navigate common stumbling blocks around money, chores, expectations, in-laws, and daily connection with structured communication frameworks.</p>
                </div>

                <h2>Toolkit Modules</h2>
                <div class="dashboard-grid">
                    <div class="dashboard-card" onclick="navigate('tool-money')">
                        <div>
                            <i class="fa-solid fa-wallet"></i>
                            <h3>Money Match</h3>
                            <p>Address the classic saver vs. spender dynamic and set clear financial rules.</p>
                        </div>
                        <div style="margin-top: 1rem; font-weight: 600; color: var(--coral); font-size: 0.9rem;">Open Tool &rarr;</div>
                    </div>
                    <div class="dashboard-card" onclick="navigate('tool-chores')">
                        <div>
                            <i class="fa-solid fa-broom"></i>
                            <h3>Chore Map</h3>
                            <p>Unpack invisible labor and create a fair, balanced household agreement.</p>
                        </div>
                        <div style="margin-top: 1rem; font-weight: 600; color: var(--coral); font-size: 0.9rem;">Open Tool &rarr;</div>
                    </div>
                    <div class="dashboard-card" onclick="navigate('tool-expectations')">
                        <div>
                            <i class="fa-solid fa-puzzle-piece"></i>
                            <h3>Expectation Check</h3>
                            <p>Compare unstated assumptions and bridge gaps before resentment sets in.</p>
                        </div>
                        <div style="margin-top: 1rem; font-weight: 600; color: var(--coral); font-size: 0.9rem;">Open Tool &rarr;</div>
                    </div>
                    <div class="dashboard-card" onclick="navigate('tool-inlaw')">
                        <div>
                            <i class="fa-solid fa-people-roof"></i>
                            <h3>In-Law Boundary</h3>
                            <p>Form a unified stance and craft boundary scripts for extended family dynamics.</p>
                        </div>
                        <div style="margin-top: 1rem; font-weight: 600; color: var(--coral); font-size: 0.9rem;">Open Tool &rarr;</div>
                    </div>
                    <div class="dashboard-card" onclick="navigate('tool-pulse')">
                        <div>
                            <i class="fa-solid fa-heart-pulse"></i>
                            <h3>Weekly Pulse</h3>
                            <p>A quick 5-minute alignment check-in across intimacy, communication, and joy.</p>
                        </div>
                        <div style="margin-top: 1rem; font-weight: 600; color: var(--coral); font-size: 0.9rem;">Open Tool &rarr;</div>
                    </div>
                </div>
            `;
        }

        // --- TOOL 1: MONEY MATCH ---
        function renderMoneyMatch() {
            const history = getHistory('money');
            let historyHtml = '';
            if (history.length > 0) {
                historyHtml = `
                    <div class="history-container">
                        <h3>Saved Sessions (${history.length})</h3>
                        <button class="btn btn-outline" style="font-size: 0.8rem; padding: 6px 12px; margin-bottom: 1rem;" onclick="clearHistory('money')">Clear History</button>
                `;
                history.forEach(item => {
                    historyHtml += `
                        <div class="history-item">
                            <div class="history-header"><span>${item.date}</span></div>
                            <p><strong>Income:</strong> $${item.data.income} | <strong>Mismatch:</strong> ${item.data.styleA} vs ${item.data.styleB}</p>
                            <p><strong>Disagreement:</strong> ${item.data.disagreement}</p>
                        </div>
                    `;
                });
                historyHtml += `</div>`;
            }

            return `
                <div class="card">
                    <h2><i class="fa-solid fa-wallet" style="color: var(--coral); margin-right: 8px;"></i> Money Match</h2>
                    <p><strong>Problem:</strong> "One of us spends. One of us saves." Bridge your financial philosophies and establish fair boundaries.</p>
                    
                    <div style="margin-bottom: 1.5rem;">
                        <button class="btn btn-secondary" onclick="loadSampleMoney()"><i class="fa-solid fa-wand-magic-sparkles"></i> Load Sample Scenario</button>
                    </div>

                    <form id="money-form" onsubmit="handleMoneySubmit(event)">
                        <div class="form-group">
                            <label>Your monthly combined income ($):</label>
                            <input type="number" id="money-income" placeholder="e.g. 7500" required>
                        </div>

                        <div class="form-group">
                            <label>Partner A spending style:</label>
                            <div class="radio-group">
                                <label class="radio-label"><input type="radio" name="styleA" value="Saver" checked> Saver</label>
                                <label class="radio-label"><input type="radio" name="styleA" value="Balanced"> Balanced</label>
                                <label class="radio-label"><input type="radio" name="styleA" value="Spender"> Spender</label>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Partner B spending style:</label>
                            <div class="radio-group">
                                <label class="radio-label"><input type="radio" name="styleB" value="Saver"> Saver</label>
                                <label class="radio-label"><input type="radio" name="styleB" value="Balanced"> Balanced</label>
                                <label class="radio-label"><input type="radio" name="styleB" value="Spender" checked> Spender</label>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Biggest money disagreement:</label>
                            <select id="money-disagreement">
                                <option value="Discretionary spending">Discretionary spending</option>
                                <option value="Savings rate">Savings rate</option>
                                <option value="Debt">Debt</option>
                                <option value="Hidden purchases">Hidden purchases</option>
                                <option value="Uneven contribution">Uneven contribution</option>
                                <option value="Different priorities">Different priorities</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Shared savings goal (optional):</label>
                            <textarea id="money-goal" placeholder="e.g. Save for a house down payment in 2 years"></textarea>
                        </div>

                        <button type="submit" class="btn">Generate Money Plan</button>
                    </form>

                    <div id="money-output"></div>
                    ${historyHtml}
                </div>
            `;
        }

        function loadSampleMoney() {
            document.getElementById('money-income').value = 7500;
            document.querySelector('input[name="styleA"][value="Saver"]').checked = true;
            document.querySelector('input[name="styleB"][value="Spender"]').checked = true;
            document.getElementById('money-disagreement').value = 'Discretionary spending';
            document.getElementById('money-goal').value = 'Building a $30,000 house down payment fund while still enjoying weekend activities.';
        }

        function handleMoneySubmit(event) {
            event.preventDefault();
            const income = document.getElementById('money-income').value;
            const styleA = document.querySelector('input[name="styleA"]:checked').value;
            const styleB = document.querySelector('input[name="styleB"]:checked').value;
            const disagreement = document.getElementById('money-disagreement').value;
            const goal = document.getElementById('money-goal').value || 'Secure financial future together';

            saveHistory('money', { income, styleA, styleB, disagreement, goal });

            const outputDiv = document.getElementById('money-output');
            outputDiv.innerHTML = `

                        <button class="btn btn-secondary" onclick="loadSamplePulse()"><i class="fa-solid fa-wand-magic-sparkles"></i> Load Sample Scenario</button>
                    </div>

                    <form id="pulse-form" onsubmit="handlePulseSubmit(event)">
                        ${sliderRows}
                        <button type="submit" class="btn">Calculate Weekly Pulse</button>
                    </form>

                    <div id="pulse-output"></div>
                    ${historyHtml}
                </div>
            `;
        }

        function loadSamplePulse() {
            const sampleScores = {
                connection: { a: 8, b: 5 },
                communication: { a: 6, b: 6 },
                chores: { a: 4, b: 7 },
                money: { a: 9, b: 8 },
                joy: { a: 5, b: 6 }
            };
            for (let key in sampleScores) {
                document.getElementById(`slider-a-${key}`).value = sampleScores[key].a;
                document.getElementById(`val-a-${key}`).textContent = sampleScores[key].a;
                document.getElementById(`slider-b-${key}`).value = sampleScores[key].b;
                document.getElementById(`val-b-${key}`).textContent = sampleScores[key].b;
            }
        }

        function handlePulseSubmit(event) {
            event.preventDefault();
            const categories = ['connection', 'communication', 'chores', 'money', 'joy'];
            let scores = {};
            let totalSum = 0;
            let lowestScore = 10;
            let lowestCategory = '';
            let divergences = [];
            let alignments = [];

            categories.forEach(cat => {
                const a = parseInt(document.getElementById(`slider-a-${cat}`).value);
                const b = parseInt(document.getElementById(`slider-b-${cat}`).value);
                scores[cat] = { a, b, avg: (a + b) / 2 };
                totalSum += (a + b) / 2;

                const avg = (a + b) / 2;
                if (avg < lowestScore) {
                    lowestScore = avg;
                    lowestCategory = cat;
                }

                const diff = Math.abs(a - b);
                if (diff >= 3) {
                    divergences.push(`${cat.charAt(0).toUpperCase() + cat.slice(1)} (Partner A rated ${a}, Partner B rated ${b})`);
                } else if (diff === 0) {
                    alignments.push(`${cat.charAt(0).toUpperCase() + cat.slice(1)} (Both rated ${a})`);
                }
            });

            const avgScore = (totalSum / categories.length).toFixed(1);
            saveHistory('pulse', { avgScore });

            let catLabels = {
                connection: 'Connection',
                communication: 'Communication',
                chores: 'Chores fairness',
                money: 'Money peace',
                joy: 'Fun / Joy'
            };

            let dashboardRows = '';
            categories.forEach(cat => {
                const avg = scores[cat].avg;
                let badge = `<span class="badge badge-green">Green (7-10)</span>`;
                if (avg < 4) badge = `<span class="badge badge-red">Red (1-3)</span>`;
                else if (avg < 7) badge = `<span class="badge badge-yellow">Yellow (4-6)</span>`;

                dashboardRows += `
                    <tr>
                        <td style="font-weight: 500;">${catLabels[cat]}</td>
                        <td>A: ${scores.a || scores[cat].a} | B: ${scores.b || scores[cat].b}</td>
                        <td>Avg: ${avg.toFixed(1)}</td>
                        <td>${badge}</td>
                    </tr>
                `;
            });

            const outputDiv = document.getElementById('pulse-output');
            outputDiv.innerHTML = `
                <div class="output-section">
                    <h4><i class="fa-solid fa-gauge-high"></i> Your Marriage This Week (Average Score: ${avgScore}/10)</h4>
                    <table>
                        <thead>
                            <tr>
                                <th>Pillar</th>
                                <th>Scores</th>
                                <th>Average</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${dashboardRows}
                        </tbody>
                    </table>
                </div>

                <div class="output-section">
                    <h4><i class="fa-solid fa-handshake-angle"></i> Areas of Alignment</h4>
                    <p>${alignments.length > 0 ? alignments.join(', ') : 'You both experienced similar levels across pillars this week with minor variations.'}</p>
                </div>

                <div class="output-section">
                    <h4><i class="fa-solid fa-triangle-exclamation"></i> Areas Needing Attention (Divergence of 3+ points)</h4>
                    <p>${divergences.length > 0 ? divergences.join('<br>') : 'None! You are remarkably aligned in your perceptions this week.'}</p>
                </div>

                <div class="output-section">
                    <h4><i class="fa-solid fa-bullseye"></i> One Conversation to Have This Week</h4>
                    <p>Focus on your lowest combined score: <strong>${catLabels[lowestCategory]}</strong> (${lowestScore}/10). Ask each other: <em>"What is one small thing I could do this week to help bump this score up by just one point?"</em></p>
                </div>

                <div class="output-section">
                    <h4><i class="fa-solid fa-seedling"></i> One Small Win</h4>
                    <p>Pick one immediate, 15-minute action for tonight—such as a 15-minute phone-free walk together, making coffee for each other, or offering an unprompted expression of gratitude.</p>
                </div>
            `;
            renderView();
        }

        // Initialize App on load
        window.addEventListener('DOMContentLoaded', () => {
            renderView();
        });
    </script>
</body>
</html>
